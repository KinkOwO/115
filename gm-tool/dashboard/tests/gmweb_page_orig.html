<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DFO 115 单机服 GM 工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:#14161a;color:#e6e8ec}
header{padding:14px 20px;background:#1c2026;border-bottom:1px solid #2a3038;display:flex;align-items:center;gap:16px}
header h1{font-size:16px;margin:0;font-weight:600}
header .meta{color:#8b93a1;font-size:12px}
main{display:flex;height:calc(100vh - 53px)}
aside{width:280px;background:#181b20;border-right:1px solid #2a3038;overflow:auto;flex:none}
aside h2{font-size:12px;color:#8b93a1;margin:16px 16px 6px;letter-spacing:.08em}
.item{padding:8px 16px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:#20242b}
.item.active{background:#232a34;border-left-color:#4c8bf5}
.item .sub{color:#8b93a1;font-size:12px}
section{flex:1;overflow:auto;padding:20px}
h3{margin:0 0 12px;font-size:15px}
.card{background:#1c2026;border:1px solid #2a3038;border-radius:8px;padding:16px;margin-bottom:16px}
label{display:block;color:#8b93a1;font-size:12px;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;background:#111318;border:1px solid #333a45;border-radius:6px;color:#e6e8ec;font:inherit}
input:focus,select:focus{outline:none;border-color:#4c8bf5}
button{padding:9px 16px;background:#4c8bf5;border:0;border-radius:6px;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#3d7ae4}
button.ghost{background:#2a3038}
button.ghost:hover{background:#343c48}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #242a33}
th{color:#8b93a1;font-weight:500;font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}
.kv div:nth-child(odd){color:#8b93a1}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;background:#2a3038;font-size:12px;color:#a9b2c0;margin-right:6px}
.ok{color:#5ad07f}.err{color:#f0605d}.warn{color:#ffc85c}
.hint{color:#8b93a1;font-size:12px;margin-top:8px}
.hint b{color:#c8cfda}
.warnbox{background:#2a2418;border:1px solid #4a3d22;border-radius:6px;padding:10px 12px;margin-top:10px;color:#ffc85c;font-size:12px}
.errbox{background:#2a1a1a;border:1px solid #4a2626;border-radius:6px;padding:10px 12px;margin-top:10px;color:#f0605d;font-size:12px}
.okbox{background:#16261c;border:1px solid #23472f;border-radius:6px;padding:10px 12px;margin-top:10px;color:#5ad07f;font-size:12px}
.tabbar{display:flex;gap:6px;margin-bottom:12px}
.tabbar button{background:#232a34;color:#a9b2c0}
.tabbar button.on{background:#2c3b55;color:#cfe0fb}
table.bag input{width:88px;padding:4px 6px}
table.bag td.sec{color:#8b93a1;font-size:12px}
.pill.unknown{background:#4a3d22;color:#ffc85c}
.pill.worn{background:#243244;color:#9dbcf0}
.pill.no{background:#402430;color:#f08fa0}
.pill.raw{background:#242a33;color:#8b93a1}
input[disabled],button[disabled]{opacity:.45;cursor:default}
.attrs{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:13px}
.attrs div:nth-child(odd){color:#8b93a1}
.res2.blocked{opacity:.5}
.res2.blocked .nm{color:#8b93a1}
.searchbox{position:relative}
.result{max-height:300px;overflow:auto;border:1px solid #2a3038;border-radius:6px;margin-top:8px}
.result .row2{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid #20242b}
.result .row2:hover{background:#232a34}
.tag{color:#8b93a1;font-size:12px}
.kw{display:inline-block;padding:3px 9px;margin:3px 5px 3px 0;border-radius:12px;background:#1f242c;border:1px solid #2a3038;cursor:pointer;font-size:12px;color:#a9b2c0}
.kw:hover{background:#232a34}
.kw.active{background:#2c3b55;border-color:#4c8bf5;color:#cfe0fb}
.kw .n{color:#8b93a1;margin-left:4px}
.kw.active .n{color:#9dbcf0}
.kw.zero{opacity:.42}
.kw .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.filters{margin-top:12px;padding-top:10px;border-top:1px solid #242a33}
.filters .flabel{color:#8b93a1;font-size:12px;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.filters .flabel b{color:#c8cfda;font-weight:500}
.chosen{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#232a34;border-radius:6px;margin-top:6px}
.chosen input{width:80px}
</style>
</head>
<body>
<header>
  <h1>DFO 115 单机服 · GM 工具</h1>
  <span class="meta" id="meta">载入中…</span>
</header>
<main>
  <aside>
    <h2>账号</h2>
    <div id="accounts"></div>
    <h2>角色</h2>
    <div id="characters"><div class="item sub" style="padding:8px 16px">先选一个账号</div></div>
  </aside>
  <section id="panel"><div class="card">请选择左侧的角色。</div></section>
</main>
<script>
var TOKEN = "c8675d395b693b4de1564d28a81f696b";
var state = { account:0, accountName:"", character:null, cera:0, chars:[],
  itemType:"", slot:"", levelMin:0, levelMax:0, rarity:"", filters:null,
  // detail 是 /api/character 的完整返回；bag/quests/limits 是渲染与提交要用的三个切片。
  detail:null, bag:[], quests:{}, limits:{},
  // attrOpen 记"展开全部属性"的展开状态；grantableOnly 是物品搜索的"只看可发放"开关
  // （默认开：用户反馈"依旧发不了装备"，挑到发不出去的东西不该是默认体验）。
  attrOpen:false, grantableOnly:true };

// RARITY_COLORS 只用于界面上区分品级（0..8 与 /api/filters 的品级顺序一致）。
// 白/蓝/紫/粉/黄/橙/彩 取自腾讯官方新手引导页给出的稀有度配色；
// 勇者(5)、太初(8) 是该页之后新增的品级，官方页没有对应说明，这里按色阶补色，
// 仅作界面辨识，不代表游戏内数值。品级中文名一律来自 /api/filters。
var RARITY_COLORS = ["#cfd6e4","#6fc3ff","#b07cf5","#ff8fd0","#ffc85c","#ff9d6b","#ff8a3d","#ff5f5f","#7ef9ff"];

function api(path, opts){
  opts = opts || {};
  var url = path + (path.indexOf("?")>=0 ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
  if (opts.body) { opts.headers = {"Content-Type":"application/json"}; opts.body = JSON.stringify(opts.body); }
  return fetch(url, opts).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; });
  });
}
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

// applyURLFilters 让页面 URL 也能直接带筛选条件，例如
//   /?slot=武器&rarity=史诗&level_min=110&limit=5
//   /?slot=耳环
//   /?rarity=太初&q=短剑
// 这样"装备词典"式的查询可以收藏/转发；条件与界面控件共用同一份 state，
// 因此打开后控件选中态和结果条数都是对的。
function applyURLFilters(){
  var p = new URLSearchParams(location.search);
  state.itemType = p.get("type") || "";
  state.slot = p.get("slot") || "";
  state.rarity = p.get("rarity") || "";
  state.levelMin = parseInt(p.get("level_min")||"0",10) || 0;
  state.levelMax = parseInt(p.get("level_max")||"0",10) || 0;
  state.presetQ = p.get("q") || "";
}
applyURLFilters();

api("/api/overview").then(function(o){
  el("meta").textContent = "物品索引 " + o.items + " 件 · 目录等级上限 " + o.grade_cap + " · 环境 " + o.root;
  el("accounts").innerHTML = o.accounts.map(function(a){
    return "<div class=\"item\" data-acc=\"" + a.id + "\" data-name=\"" + esc(a.username) + "\">" + esc(a.username) + "<div class=\"sub\">账号 ID " + a.id + "</div></div>";
  }).join("") || "<div class=\"item sub\">没有账号</div>";
  Array.prototype.forEach.call(document.querySelectorAll("#accounts .item"), function(node){
    node.onclick = function(){ selectAccount(parseInt(node.dataset.acc,10), node.dataset.name); };
  });
}).catch(function(e){ el("meta").innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });

function selectAccount(id, name){
  state.account = id; state.accountName = name; state.character = null;
  state.detail = null; state.bag = []; state.quests = {}; state.limits = {};
  Array.prototype.forEach.call(document.querySelectorAll("#accounts .item"), function(n){ n.classList.toggle("active", parseInt(n.dataset.acc,10)===id); });
  el("characters").innerHTML = "<div class=\"item sub\" style=\"padding:8px 16px\">载入中…</div>";
  api("/api/characters?account=" + id).then(function(o){
    state.cera = o.cera; state.chars = o.characters;
    el("characters").innerHTML = o.characters.map(function(c){
      return "<div class=\"item\" data-cid=\"" + c.id + "\">" + esc(c.name) + "<div class=\"sub\">" + esc(c.class_name) + " · Lv." + c.level + " · 金币 " + c.gold + "</div></div>";
    }).join("") || "<div class=\"item sub\" style=\"padding:8px 16px\">该账号还没有角色</div>";
    Array.prototype.forEach.call(document.querySelectorAll("#characters .item"), function(n){
      if(!n.dataset.cid) return;
      n.onclick = function(){ selectCharacter(parseInt(n.dataset.cid,10)); };
    });
    renderGrant();
  }).catch(function(e){ el("characters").innerHTML = "<div class=\"item err\">" + esc(e.message) + "</div>"; });
}

// selectCharacter 拉一个角色的完整状态。/api/character 除了存档摘要，还带几样
// 界面必需的东西：背包逐行（含 section，区分 items / worn / equipment）、
// 任务条数、attribute_groups（汉化 + 分组后的属性，见 attributes.go）、
// 以及 limits（改存档能不能用、上限多少、哪些项禁用）。
function selectCharacter(id){
  Array.prototype.forEach.call(document.querySelectorAll("#characters .item"), function(n){ n.classList.toggle("active", parseInt(n.dataset.cid,10)===id); });
  api("/api/character?id=" + id).then(function(o){
    state.character = o.character; state.cera = o.cera;
    state.detail = o; state.bag = o.bag || []; state.quests = o.quests || {}; state.limits = o.limits || {};
    renderCharacter(o); renderGrant(); loadHistory();
  }).catch(function(e){ el("panel").innerHTML = "<div class=\"card err\">" + esc(e.message) + "</div>"; });
}

// renderCharacter 只负责把 /api/character 的结果记进 state；
// 真正的渲染交给 renderGrant（它把"角色修改"区与"发放资产"区渲染在同一页里）。
function renderCharacter(o){
  state.detail = o;
  state.character = o.character;
  state.cera = o.cera;
  state.bag = o.bag || [];
  state.quests = o.quests || {};
  state.limits = o.limits || {};
}

// ---------- 角色修改：等级 / 技能点 / 背包数量 / 任务 / 转职 ----------
//
// UI 组织参照联网调研到的公开 DNF GM 工具（crazytuzi/DNF__GM_Tools 的主窗口）：
// 一个角色的修改项按用途分卡（等级 / 技能点 / 背包 / 任务 / 转职），
// 必填与上限就地写在卡片里，破坏性操作（批量完成任务）单独二次确认，
// 并直接在卡片上写清"角色在线时要先切换到别的角色"这类注意事项。

function charCardsHTML(){
  var d = state.detail;
  if(!d){
    return "<div class=\"card\"><h3>角色修改</h3><div class=\"hint\">在左侧选一个角色，这里会出现改等级 / 技能点 / 背包数量 / 一键完成任务的表单。</div></div>";
  }
  var c = d.character, s = d.summary || {}, lim = d.limits || {};
  var ag = s.attribute_groups || {core:[], more:[]};
  var sp = (s.skill_points||[0,0]), tp = (s.technique_points||[0,0]);
  var serverCap = lim.server_level_cap || 0, clientCap = lim.client_level_cap || 115;
  var dis = lim.enabled ? "" : " disabled";

  var capNote;
  if(lim.enabled){
    capNote =
      "<div class=\"hint\">服务端经验规则 <b>experience.compat90.json</b> 的 <b>level_cap = " + serverCap + "</b> 是硬上限（超过它，服务端自己的经验函数就会拒收）；" +
      "本发布包对应客户端的等级上限是 <b>" + clientCap + "</b>。" +
      "等级超过客户端上限（" + clientCap + "）会不会有问题<b>由你决定</b>：公开资料记录过把等级改到服务端上限以上会导致服务端崩溃/假死、" +
      "物品和装备全红用不了、以及拿不到 SP（见 <span class=\"tag\">dnf.gamerba.com/archiver/tid-2767.html</span>）。" +
      "工具只按服务端的 " + serverCap + " 挡住，不做别的限制。</div>" +
      "<div class=\"hint\">等级与经验<b>一定成对写</b>：只改等级会让 experience 与 level 不匹配，公开工具记录过后果是「不能交易、不能穿装备」" +
      "（见 <span class=\"tag\">dnf.gamerba.com/archiver/tid-2972.html</span>）。这里把 experience 设成该等级的门槛，" +
      "门槛直接用服务端自己的成长目录算出来，不是本工具编的公式。</div>";
  } else {
    capNote = "<div class=\"errbox\">改存档功能未启用：" + esc(lim.reason || "未载入成长目录 / 角色目录") + "</div>";
  }

  return "" +
  "<div class=\"card\"><h3>" + esc(c.name) + " <span class=\"pill\">" + esc(c.class_name) + "</span> <span class=\"pill\">Lv." + c.level + "</span></h3>" +
    "<div class=\"kv\">" +
      "<div>角色 ID</div><div>" + c.id + "</div>" +
      "<div>账号</div><div>" + esc(state.accountName) + " (ID " + d.account + ")</div>" +
      "<div>经验</div><div>" + c.experience + "</div>" +
      "<div>金币</div><div>" + c.gold + "</div>" +
      "<div>点券</div><div>" + d.cera + "</div>" +
      "<div>觉醒阶段</div><div>" + s.advancement + "</div>" +
      "<div>SP</div><div>" + sp.join(" / ") + "</div>" +
      "<div>TP</div><div>" + tp.join(" / ") + "</div>" +
    "</div>" +
    attrBlockHTML(ag) +
  "</div>" +

  "<div class=\"card\"><h3>1. 改等级</h3>" +
    "<div class=\"row\">" +
      "<div><label>目标等级（当前 " + c.level + "）</label><input id=\"lv_target\" type=\"number\" min=\"1\" max=\"" + (serverCap||65535) + "\" value=\"" + c.level + "\"" + dis + "></div>" +
      "<div><label>&nbsp;</label><label style=\"color:#e6e8ec\"><input type=\"checkbox\" id=\"lv_recalc\" style=\"width:auto\"" + dis + "> 同时把技能点按该级重算为满值</label></div>" +
    "</div>" +
    "<div style=\"margin-top:14px\"><button id=\"lv_do\"" + dis + ">执行改等级</button> <span id=\"lv_msg\" class=\"hint\"></span></div>" +
    capNote +
    "<div class=\"hint\">经验门槛与满值 SP 都来自服务端成长目录 <b>progression.next25.json</b>；改完读回会自检一次，对不上就整笔拒绝。</div>" +
    "<div class=\"hint\">属性不随等级改动：不碰 attributes 是为了不越过服务端 EntryAddition 的原生边界校验。改动前会先把当前 state 备份到 <b>" + esc(lim.backup_dir||"") + "</b>。</div>" +
    "<div class=\"hint err\">角色正在线上时，必须重新选择角色（小退再进）才会看到改动。</div>" +
  "</div>" +

  "<div class=\"card\"><h3>2. 技能点（SP / TP）</h3>" +
    "<div class=\"row\">" +
      "<div><label>SP（第 1 条账本）</label><input id=\"sk_sp0\" type=\"number\" min=\"0\" max=\"65535\" value=\"" + sp[0] + "\"" + dis + "></div>" +
      "<div><label>SP（第 2 条账本）</label><input id=\"sk_sp1\" type=\"number\" min=\"0\" max=\"65535\" value=\"" + sp[1] + "\"" + dis + "></div>" +
      "<div><label>TP（第 1 条账本）</label><input id=\"sk_tp0\" type=\"number\" min=\"0\" max=\"65535\" value=\"" + tp[0] + "\"" + dis + "></div>" +
      "<div><label>TP（第 2 条账本）</label><input id=\"sk_tp1\" type=\"number\" min=\"0\" max=\"65535\" value=\"" + tp[1] + "\"" + dis + "></div>" +
    "</div>" +
    "<div style=\"margin-top:14px\"><button id=\"sk_do\"" + dis + ">按上面的值写入</button> " +
      "<button class=\"ghost\" id=\"sk_recalc\"" + dis + ">按当前 Lv." + c.level + " 重算 SP 为满值</button> " +
      "<span id=\"sk_msg\" class=\"hint\"></span></div>" +
    "<div class=\"hint\">两个数组是服务端协议里的两条技能树账本（SP 与 TP 各一对）。重算 SP 会把两条都写成该级累计满值，" +
      "并复用第 1 条同一套算法 —— 与服务端 ApplyGain 把每级 SP 增益同时加进两条一致；已学技能不会退回，相当于把已花掉的 SP 也补满。</div>" +
    "<div class=\"hint\">TP 没有服务端来源表（成长目录只有按级 SP，TP 全靠任务给），所以只能手填；填了两条都会写，免得游戏里两边不一致。</div>" +
    "<div class=\"hint err\">角色正在线上时，必须重新选择角色（小退再进）才会看到改动。</div>" +
  "</div>" +

  bagCardHTML(lim) +

  questCardHTML(lim) +

  "<div class=\"card\"><h3>5. 转职 / 觉醒 <span class=\"pill\">禁用</span></h3>" +
    "<div class=\"errbox\">" + esc(lim.advancement_reason || "未调查") + "</div>" +
    "<div class=\"hint\">这一项在界面上只做说明，不提供按钮 —— 给一个会把角色弄坏的按钮比没有按钮更糟。</div>" +
  "</div>";
}

// attrRowHTML 渲染一行属性：中文名做主标签，原始内部键只放进 title 提示。
// 内置对照表里没有的键标「未汉化」并原样显示键名 —— 不猜、也不隐藏。
function attrRowHTML(r){
  var label = r.localized ? esc(r.label)
                          : esc(r.label) + " <span class=\"pill raw\">未汉化</span>";
  return "<div title=\"" + esc(r.key) + "\">" + label + "</div><div>" + r.value + "</div>";
}

// attrBlockHTML 渲染属性区：默认只铺精选核心属性，其余折叠在「展开全部属性」里。
// 依据：用户反馈原先把 state.attributes 几十行英文内部键全铺出来，"看不懂也没必要全看"。
function attrBlockHTML(ag){
  var core = ag.core || [], more = ag.more || [];
  if(!core.length && !more.length) return "";
  var html = "<div class=\"filters\">" +
    "<div class=\"flabel\"><b>核心属性</b><span class=\"tag\">存档原值，未换算</span></div>" +
    "<div class=\"attrs\">" + core.map(attrRowHTML).join("") + "</div>";
  if(more.length){
    html += "<div id=\"attr_more\" class=\"attrs\" style=\"display:" + (state.attrOpen ? "grid" : "none") + "\">" +
      more.map(attrRowHTML).join("") + "</div>" +
      "<div style=\"margin-top:8px\"><button class=\"ghost\" id=\"attr_toggle\" style=\"padding:3px 10px;font-size:12px\">" +
      (state.attrOpen ? "收起其余属性" : "展开全部属性（另有 " + more.length + " 项）") + "</button></div>";
  }
  if(ag.note) html += "<div class=\"hint\">" + esc(ag.note) + "</div>";
  return html + "</div>";
}

// bindAttrToggle 绑定"展开全部属性"。展开状态记在 state.attrOpen 里，
// 这样重新拉角色数据（每次写操作后都会刷）不会把用户刚展开的列表收回去。
function bindAttrToggle(){
  var b = el("attr_toggle"); if(!b) return;
  b.onclick = function(){ state.attrOpen = !state.attrOpen; if(state.detail) renderGrant(); };
}


// 物品行改数量（设 0 即删除该行），装备行只改 durability；template / slot 不给改。
// bagCardHTML 渲染背包与装备的可编辑表格。
function bagCardHTML(lim){
  var rows = state.bag || [];
  var dis = lim.enabled ? "" : " disabled";
  var secLabel = {"items":"背包", "worn":"已穿戴(worn)", "equipment":"装备(equipment)"};
  var body = rows.map(function(b){
    var field = b.section === "items" ? "amount" : "durability";

    var orig = b.section === "items" ? (b.amount==null?0:b.amount) : (b.durability==null?0:b.durability);
    var flag = b.flag === "unknown" ? " <span class=\"pill unknown\">物品库不认识</span>" : "";

      : "<input class=\"bagedit\" type=\"number\" min=\"0\" max=\"65535\" data-section=\"" + b.section + "\" data-slot=\"" + b.slot + "\" data-field=\"durability\" data-orig=\"" + orig + "\" value=\"" + val + "\"" + dis + ">";

  return "<div class=\"card\"><h3>3. 背包与装备</h3>" +

      ? "<table class=\"bag\" id=\"bagtable\"><thead><tr><th>所在</th><th>槽位</th><th>ID</th><th>名称</th><th>数量 / 耐久</th></tr></thead><tbody>" + body + "</tbody></table>"
      : "<div class=\"hint\">这个角色的背包、worn 与 equipment 都是空的。</div>") +
    "<div style=\"margin-top:14px\"><button id=\"bag_do\"" + dis + ">保存修改</button> <span id=\"bag_msg\" class=\"hint\"></span></div>" +
    "<div class=\"hint\">只改已有行：<b>物品行填 0 就是删除该行</b>；装备行（worn / equipment）只能改 durability，template 与 slot 一律不给改 —— " +
      "服务端只认自己发过的 template，也只为存档里已存在的槽位做过映射，凭空写一个就是造一个服务端不认的物品。" +
      "公开资料也记录过往背包里塞时装会导致炸服，所以这里不提供新增行。</div>" +
    "<div class=\"hint\">保存时整个 <b>inventory</b> 容器一起写回：没改到的 section 连键名（含老存档的大写 Amount/Template）一起原样保留。" +
      "「物品库不认识」是提示这件 template 不在本包的物品库里，不是错误。</div>" +
    "<div class=\"hint err\">角色正在线上时，必须重新选择角色（小退再进）才会看到改动。</div>" +
    "<div class=\"hint\">改动前会把当前 state 备份到 <b>" + esc(lim.backup_dir||"") + "</b>（文件名带角色 id 与时间戳）。</div>" +
  "</div>";
}

// renderGrant 渲染整个右侧面板：先是"角色修改"区（见 charCardsHTML），
// 再是原有的"发放资产"区，最后是发放记录。两区放在同一页里（一次滚动就能看全），
// 不引入页签状态，避免"点开了修改区就找不到发放区"。
// ---------- 角色修改区的事件绑定 ----------

// stateEditPost 是四个改存档接口共用的提交壳：
// 禁用按钮 → POST → 把 message/note/backup/receipt 显示到 span 里 → 重新选一次角色刷新。
// 任何失败都原样把后端的错误显示出来（后端会说清是 400 参数错、403/503 未启用，
// 还是这次改动被整笔回滚了）。
function stateEditPost(path, body, msgEl, done){
  var msg = el(msgEl);
  if(msg) msg.textContent = "提交中…";
  api(path, {method:"POST", body:body}).then(function(o){
    var receipt = o.receipt ? JSON.stringify(o.receipt) : "";
    if(msg){
      msg.innerHTML = "<span class=\"ok\">" + esc(o.message || "完成") + "</span> " + esc(o.note || "") +
        (o.backup ? "<br>备份：" + esc(o.backup) : "") +
        (receipt ? "<br><span class=\"tag\">回执 " + esc(receipt) + "</span>" : "");
    }
    if(done) done(o);
  }).catch(function(e){
    if(msg) msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>（没有写入，或已整笔回滚）";
  });
}

function refreshCharacter(){
  if(state.character) selectCharacter(state.character.id);
  else if(state.account) selectAccount(state.account, state.accountName);
}

function bindCharCards(){
  bindAttrToggle();
  var lim = state.limits || {};
  if(!lim.enabled || !state.detail) return;

  // 1. 等级
  if(el("lv_do")) el("lv_do").onclick = function(){
    var v = parseInt(el("lv_target").value, 10);
    if(isNaN(v) || v < 1){ el("lv_msg").innerHTML = "<span class=\"err\">等级要填 1 以上的整数。</span>"; return; }
    var cap = lim.server_level_cap || 0;
    if(cap && v > cap){ el("lv_msg").innerHTML = "<span class=\"err\">服务端上限是 " + cap + " 级，先改经验规则再谈。</span>"; return; }
    var note = v > (lim.client_level_cap || 115)
      ? "\n\n注意：目标等级 " + v + " 超过客户端上限 " + (lim.client_level_cap||115) + "。\n公开资料记录过超过上限会导致服务端崩溃/假死、物品全红、拿不到 SP。\n确定要改吗？"
      : "";
    if(note && !confirm("把 " + state.character.name + " 从 Lv." + state.character.level + " 改成 Lv." + v + "？" + note)) return;
    stateEditPost("/api/state/level", {
      account: state.account, character: state.character.id,
      level: v, recalc_skill_points: el("lv_recalc").checked,
      reason: "GM 工具改等级 -> " + v
    }, "lv_msg", refreshCharacter);
  };

  // 2. 技能点
  function skillsBody(recalc){
    var b = { account: state.account, character: state.character.id,
      reason: recalc ? "GM 工具按等级重算 SP" : "GM 工具改技能点" };
    if(recalc){
      b.recalc_skill_points = true;
    } else {
      b.skill_points = [parseInt(el("sk_sp0").value,10)||0, parseInt(el("sk_sp1").value,10)||0];
      b.technique_points = [parseInt(el("sk_tp0").value,10)||0, parseInt(el("sk_tp1").value,10)||0];
    }
    return b;
  }
  if(el("sk_do")) el("sk_do").onclick = function(){
    stateEditPost("/api/state/skills", skillsBody(false), "sk_msg", refreshCharacter);
  };
  if(el("sk_recalc")) el("sk_recalc").onclick = function(){
    stateEditPost("/api/state/skills", skillsBody(true), "sk_msg", refreshCharacter);
  };

  // 3. 背包与装备：只把"和原值不一样"的行提交上去，没动过的行一个字节都不发。
  if(el("bag_do")) el("bag_do").onclick = function(){
    var edits = [], bad = "";
    Array.prototype.forEach.call(document.querySelectorAll("#bagtable input.bagedit"), function(inp){
      var raw = inp.value.trim();
      if(raw === ""){ bad = bad || "有空的数量/耐久没填。"; return; }
      var v = parseInt(raw, 10);
      if(isNaN(v) || v < 0){ bad = bad || "数量/耐久要是 0 以上的整数。"; return; }
      if(v > parseInt(inp.max, 10)){ bad = bad || ("超过上限 " + inp.max + "。"); return; }
      if(String(v) === inp.dataset.orig) return;
      var e = { section: inp.dataset.section, slot: parseInt(inp.dataset.slot, 10) };
      e[inp.dataset.field] = v;
      if(inp.dataset.field === "amount") e.amount = v; else e.durability = v;
      edits.push(e);
    });
    if(bad){ el("bag_msg").innerHTML = "<span class=\"err\">" + esc(bad) + "</span>"; return; }
    if(!edits.length){ el("bag_msg").innerHTML = "<span class=\"err\">没有改动。</span>"; return; }
    var zero = edits.filter(function(e){ return e.amount === 0; }).length;
    if(zero && !confirm("有 " + zero + " 行数量填了 0，这些行会被删除。确定要保存吗？")) return;
    stateEditPost("/api/state/bag", {
      account: state.account, character: state.character.id, edits: edits,
      reason: "GM 工具改背包数量/耐久"
    }, "bag_msg", refreshCharacter);
  };

  // 4. 任务一键完成：必须先在界面上二次确认，后端也要求 confirm=true。
  if(el("q_do")) el("q_do").onclick = function(){
    if(!el("q_confirm").checked){
      el("q_msg").innerHTML = "<span class=\"err\">先勾选上面的二次确认。</span>";
      return;
    }
    var q = state.quests || {};
    if(!q.accepted){
      el("q_msg").innerHTML = "<span class=\"err\">这个角色现在没有已接取的任务，没有可完成项。</span>";
      return;
    }
    if(!confirm("把 " + state.character.name + " 的 " + q.accepted + " 条已接取任务改成已完成？\n只改状态，不插入新任务。\n请先确认角色已经切换到别的角色（或退回选人界面）。")) return;
    stateEditPost("/api/state/quests", {
      account: state.account, character: state.character.id,
      confirm: true, expect_accepted: q.accepted,
      reason: "GM 工具一键完成已接取任务"
    }, "q_msg", refreshCharacter);
  };
}

// loadTypes 拉取分类列表与每类数量，渲染成可点选的类型筛选项。
// 装备类会再列出各装备位（key 可直接当 type= 用）。
function loadTypes(){
  var box = el("types"); if(!box) return;
  api("/api/types").then(function(o){
    state.types = o.types || [];
    renderTypes();
  }).catch(function(e){ box.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}
function renderTypes(){
  var box = el("types"); if(!box || !state.types) return;
  var html = kw("type", "", "全部", "", state.itemType, null);
  state.types.forEach(function(t){ html += kw("type", t.key, t.label, t.count, state.itemType, null); });
  state.types.forEach(function(t){
    (t.children||[]).forEach(function(c){ html += kw("type", c.key, c.label, c.count, state.itemType, null, true); });
  });

  bindKws(box, "type", function(v){ state.itemType = v; renderTypes(); doSearch(); });

// loadFilters 拉取部位 / 等级 / 稀有度三个维度的可选值与数量。
// 这三个控件与类型、关键词互相叠加，任何一处改动都会重新查询。
function loadFilters(){
  api("/api/filters").then(function(f){
    state.filters = f;
    // URL 里给的稀有度可能是中文名（?rarity=太初），控件选中态用的是序号键，这里归一化。
    if(state.rarity && !/^[0-9]+$/.test(state.rarity)){
      var found = "";
      f.rarities.forEach(function(r){ if(r.label === state.rarity) found = r.key; });
      state.rarity = found;
    }
    renderSlots(); renderLevels(); renderRarities();
    el("fnote").innerHTML = "品级中文名来源：" + esc(f.rarity_source) +
      " · 装备 " + f.equipment + " 件：已归类到具体部位/时装 " + f.slot_covered +
      " 件，落在「其它装备」 " + f.slot_unknown + " 件；有最低等级 " + f.level_known +
      " 件，无等级信息 " + f.level_unknown + " 件（筛选等级时会被排除）";
    // 可发放性统计：用户"挑了却发不出去"的困惑靠这一段解释清楚。
    var g = el("gnote");
    if(g){
      var notes = (f.grant_notes||[]).map(function(n){
        return esc(n.label) + " —— " + n.count + " 件";
      }).join("<br>");
      g.innerHTML = "可发放 <b>" + f.grantable + "</b> 件 / 不可发放 <b>" + f.not_grantable +
        "</b> 件（其中装扮类没有对应背包容器被挡下 " + (f.avatar_blocked||0) + " 件）。" +
        "<br>判定来源：" + esc(f.grant_source) +
        (notes ? "<br>不可发放的原因：<br>" + notes : "");
    }
  }).catch(function(e){ el("fnote").innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}

function renderSlots(){
  var box = el("slots"); if(!box || !state.filters) return;

function renderLevels(){

function renderRarities(){

    html += kw("rarity", r.key, r.label, r.count, state.rarity, RARITY_COLORS[parseInt(r.key,10)]);

// kw 渲染一个可点选的筛选标签。activeVal 与 key 相等时为选中态。
// color 非空时在标签前画一个品级色点；min/max 用于等级档。
function kw(attr, key, label, count, activeVal, color, sub, min, max){
  var on = String(activeVal||"") === String(key);
  var attrs = " data-" + attr + "=\"" + esc(key) + "\"";
  if(min !== undefined){ attrs += " data-min=\"" + min + "\""; }
  if(max !== undefined){ attrs += " data-max=\"" + max + "\""; }
  var dot = color ? "<span class=\"dot\" style=\"background:" + color + "\"></span>" : "";
  var n = (count === "" || count === undefined || count === null) ? "" : "<span class=\"n\">" + count + "</span>";
  var cls = "kw" + (on ? " active" : "") + (sub ? " sub" : "") + (count === 0 ? " zero" : "");
  return "<span class=\"" + cls + "\"" + attrs + ">" + dot + esc(label) + n + "</span>";
}
function bindKws(box, attr, onPick){
  Array.prototype.forEach.call(box.querySelectorAll(".kw"), function(n){
    n.onclick = function(){ onPick(n.dataset[attr] || "", n); };
  });
}

// slotTag 返回物品的部位标签（装备）；堆叠物显示客户端页签分类。
function slotTag(it){ return it.slot || it.type_label || (it.kind==="equipment" ? "装备" : "普通"); }

var chosen = [];

// doSearch 查询物品。grantable=1 时只返回服务端真的收得下的条目 ——
// 这是"只看可发放"开关的实现；关掉以后不可发放的条目仍然列出来，
// 但会置灰 + 带原因，点它会直接被挡下并说明（不再等执行发放才报错）。
function doSearch(){
  var q = el("q"); if(!q) return;
  var url = "/api/items?q=" + encodeURIComponent(q.value) +
    "&type=" + encodeURIComponent(state.itemType) +
    "&slot=" + encodeURIComponent(state.slot) +
    "&level_min=" + (state.levelMin||"") +
    "&level_max=" + (state.levelMax||"") +
    "&rarity=" + encodeURIComponent(state.rarity) +
    (state.grantableOnly ? "&grantable=1" : "") +
    "&limit=60";
  api(url).then(function(o){
    var blocked = 0;
    o.items.forEach(function(it){ if(!it.grantable) blocked++; });
    el("rescount").innerHTML = "命中 " + (o.count||0) + " 条" +
      (blocked ? "（其中 <span class=\"warn\">不可发放 " + blocked + " 条</span>）" : "") +
      ((o.count||0) >= 60 ? "（只显示前 60 条，可用关键词缩小范围）" : "");
    el("res").innerHTML = o.items.map(function(it){
      var zh = it.name || it.name_en || "(未命名)";
      var color = RARITY_COLORS[it.rarity] || "#e6e8ec";
      var en = (it.name_en && it.name_en !== it.name) ? "<span class=\"tag\">" + esc(it.name_en) + "</span>" : "";
      var parts = ["ID " + it.id];
      if(it.level) parts.push("Lv" + it.level);
      if(it.rarity_label) parts.push(it.rarity_label);
      if(it.grade) parts.push("品级值 " + it.grade);
      var av = it.avatar ? " <span class=\"pill no\">装扮</span>" : "";
      var no = it.grantable ? "" :
        " <span class=\"pill no\" title=\"" + esc(it.grant_note||"") + "\">不可发放</span>";
      return "<div class=\"row2" + (it.grantable ? "" : " blocked") + "\" data-id=\"" + it.id +
        "\" data-name=\"" + esc(zh) + "\" data-grantable=\"" + (it.grantable ? "1" : "0") +
        "\" data-note=\"" + esc(it.grant_note||"") + "\">" +
        "<span><span class=\"nm\" style=\"color:" + color + "\">" + esc(zh) + "</span> " + en + av + no +
        "<div class=\"tag\">" + esc(parts.join(" · ")) + "</div>" +
        (it.grantable ? "" : "<div class=\"tag warn\">" + esc(it.grant_note||"") + "</div>") +
        "</span>" +
        "<span class=\"tag\"><span class=\"pill\">" + esc(slotTag(it)) + "</span></span></div>";
    }).join("") || "<div class=\"row2\">没有匹配的物品</div>";
    Array.prototype.forEach.call(el("res").querySelectorAll(".row2"), function(n){
      if(!n.dataset.id) return;
      n.onclick = function(){
        if(n.dataset.grantable === "0"){
          // 不可发放的条目：直接挡下并说明原因，不再让用户点了执行才发现发不出去。
          el("msg").innerHTML = "<span class=\"err\">「" + esc(n.dataset.name) + "」发不了：" +
            esc(n.dataset.note || "服务端发放路径不接受这件物品") + "</span>";
          return;
        }
        addChosen(parseInt(n.dataset.id,10), n.dataset.name);
      };
    });
  }).catch(function(e){ el("rescount").innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}
function addChosen(id, name){
  for(var i=0;i<chosen.length;i++) if(chosen[i].id===id) { chosen[i].amount++; renderChosen(); return; }
  chosen.push({id:id, name:name, amount:1}); renderChosen();
}
function renderChosen(){
  var box = el("chosen"); if(!box) return;
  box.innerHTML = chosen.map(function(c,i){
    return "<div class=\"chosen\"><span style=\"flex:1\">" + esc(c.name) + " <span class=\"tag\">ID " + c.id + "</span></span>" +
      "<input type=\"number\" min=\"1\" value=\"" + c.amount + "\" data-i=\"" + i + "\">" +
      "<button class=\"ghost\" data-del=\"" + i + "\">移除</button></div>";
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("input"), function(inp){
    inp.onchange = function(){ chosen[parseInt(inp.dataset.i,10)].amount = Math.max(1, parseInt(inp.value,10)||1); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
    b.onclick = function(){ chosen.splice(parseInt(b.dataset.del,10),1); renderChosen(); };
  });
}

function doGrant(){
  var g = el("g_char"), gold = el("g_gold"), cera = el("g_cera"), reason = el("g_reason"), msg = el("msg");
  var body = {
    account: state.account,
    character: parseInt(g.value,10) || 0,
    gold: parseInt(gold.value,10) || 0,
    cera: parseInt(cera.value,10) || 0,
    reason: reason.value || "GM 工具发放",
    items: chosen.map(function(c){ return {template:c.id, amount:c.amount}; })
  };
  if(!body.character && (body.gold || body.items.length)){ msg.innerHTML = "<span class=\"err\">金币和物品必须指定角色。</span>"; return; }
  if(!body.gold && !body.cera && !body.items.length){ msg.innerHTML = "<span class=\"err\">没有可发放的内容。</span>"; return; }
  el("do").disabled = true; msg.textContent = "提交中…";
  api("/api/grant", {method:"POST", body:body}).then(function(o){
    msg.innerHTML = "<span class=\"ok\">" + esc(o.message) + "</span> " + esc(o.note||"");
    chosen = []; renderChosen();
    if(state.character) selectCharacter(state.character.id); else { loadHistory(); }
    if(state.account) selectAccount(state.account, state.accountName);
  }).catch(function(e){ msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; })
    .then(function(){ el("do").disabled = false; });
}

function loadHistory(){
  if(!state.account) return;
  api("/api/history?account=" + state.account).then(function(o){
    var h = el("hist"); if(!h) return;
    h.innerHTML = (o.history||[]).map(function(r){
      return "<div>" + esc(r.at) + " · " + esc(r.grant_id) + " · " + esc(r.operator) + " · " + esc(r.reason) + "</div>";
    }).join("") || "还没有发放记录。";
  });
}
</script>
</body>
</html>
