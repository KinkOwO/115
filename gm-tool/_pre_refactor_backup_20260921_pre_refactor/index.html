<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DFO 115us · GM 管理台</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:#f0f2f5;color:#1f2430;overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.app{display:flex;height:100vh}

/* ===== 左侧导航 ===== */
.sidebar{width:210px;background:#1b2536;color:#c8d2e0;display:flex;flex-direction:column;flex:none}
.brand{padding:18px 18px 14px;font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em;border-bottom:1px solid #263550}
.brand small{display:block;font-size:11px;color:#7f93b5;font-weight:400;margin-top:2px}
.nav{flex:1;padding:10px 8px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 0;border-radius:8px;cursor:pointer;color:#a8b6cc;font-size:13px;transition:background .12s,color .12s}
.nav-item:hover{background:#24334d;color:#e6edf7}
.nav-item.active{background:#2f6fed;color:#fff}
.nav-item .ico{width:16px;text-align:center;opacity:.85}
.sidebar .foot{padding:12px 16px;font-size:11px;color:#6b7d9c;border-top:1px solid #263550}

/* ===== 右侧主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:54px;background:#fff;border-bottom:1px solid #e2e6ee;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.page-title{font-size:16px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:14px}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#5b6472;background:#f4f6fa;border:1px solid #e2e6ee;padding:4px 10px;border-radius:20px}
.health .dot{width:9px;height:9px;border-radius:50%;background:#b9c0cc;display:inline-block}
.health.ok .dot{background:#21b85b;box-shadow:0 0 6px rgba(33,184,91,.5)}
.health.bad .dot{background:#e5484d;box-shadow:0 0 6px rgba(229,72,77,.5)}
.gm-info{font-size:12px;color:#5b6472;background:#f4f6fa;border:1px solid #e2e6ee;padding:4px 10px;border-radius:20px}
.gm-info b{color:#2f6fed;font-weight:600}
.btn{background:#2f6fed;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:13px}
.btn:hover{background:#2861d8}
.btn.ghost{background:#fff;color:#3a4250;border:1px solid #d5dae4}
.btn.ghost:hover{background:#f2f5fa}
.btn.danger{background:#e5484d}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}

/* 搜索条 */
.searchbar{padding:14px 20px 0;display:flex;gap:8px;position:relative;flex:none;justify-content:center}
.searchbar input{flex:1;max-width:520px;padding:9px 14px;border:1px solid #d5dae4;border-radius:8px;background:#fff;color:#1f2430}
.searchbar input:focus{outline:none;border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.search-results{position:absolute;top:52px;left:20px;width:520px;max-height:320px;overflow:auto;background:#fff;border:1px solid #e2e6ee;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.12);z-index:50;display:none}
.search-results .sr{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f0f2f7}
.search-results .sr:hover{background:#f4f7fd}
.search-results .sr .k{color:#8a93a3;font-size:12px}

/* Tab */
.tabs{display:flex;gap:4px;padding:14px 20px 0;flex:none;border-bottom:1px solid #e2e6ee;justify-content:center}
.tab{padding:8px 18px;cursor:pointer;color:#5b6472;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#2f6fed}
.tab.on{color:#2f6fed;font-weight:600;border-bottom-color:#2f6fed}

/* 内容区 */
.content{flex:1;overflow:auto;padding:20px}
.card{background:#fff;border:1px solid #e2e6ee;border-radius:6px;padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-size:12px;color:#8a93a3;font-weight:400}
label{display:block;color:#5b6472;font-size:12px;margin-bottom:4px}
input[type=number],input[type=text],select,textarea{width:100%;padding:8px 10px;background:#fff;border:1px solid #d5dae4;border-radius:6px;color:#1f2430}
input:focus,select:focus{outline:none;border-color:#2f6fed}
input[disabled]{background:#f2f4f8;color:#9aa3b2}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f6}
th{color:#5b6472;font-weight:600;font-size:12px;background:#f4f6fa;border-bottom:2px solid #d8dde6}
tr:hover td{background:#f8fafd}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:#8a93a3}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;background:#eef1f6;font-size:12px;color:#5b6472;margin-right:6px}
.pill.blue{background:#e8f0fe;color:#2f6fed}
.pill.green{background:#e6f7ee;color:#1d9e54}
.pill.gray{background:#f0f2f7;color:#8a93a3}
.pill.cat{background:#eef4ff;color:#5b74c8}
.ok{color:#1d9e54}.err{color:#e5484d}.warn{color:#d97706}
.hint{color:#8a93a3;font-size:12px;margin-top:8px}
.hint b{color:#5b6472}
.warnbox{background:#fff7e8;border:1px solid #f3d9a4;border-radius:8px;padding:10px 12px;margin-top:10px;color:#9a6b00;font-size:12px}
.errbox{background:#fdf0f0;border:1px solid #f2c4c4;border-radius:8px;padding:10px 12px;margin-top:10px;color:#c22b30;font-size:12px}
.okbox{background:#eaf8f0;border:1px solid #bfe8d1;border-radius:8px;padding:10px 12px;margin-top:10px;color:#157a44;font-size:12px}
.kw{display:inline-block;padding:5px 12px;margin:0;border-radius:6px;background:#f2f4f8;border:1px solid #e2e6ee;cursor:pointer;font-size:12px;color:#5b6472}
#mail_types,#mail_slots,#mail_levels,#mail_rarities{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kw:hover{background:#eaf0fb}
.kw.active{background:#e8f0fe;border-color:#2f6fed;color:#2f6fed}
.kw .n{color:#9aa3b2;margin-left:4px}
.kw .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kw.zero{opacity:.4}
.filters{margin-top:12px;padding-top:10px;border-top:1px solid #eef1f6}
.filters .flabel{color:#8a93a3;font-size:12px;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.filters .flabel b{color:#3a4250;font-weight:600}
.searchbox{position:relative}
.result{max-height:300px;overflow:auto;border:1px solid #e2e6ee;border-radius:8px;margin-top:8px}
.result .row2{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid #f0f2f7}
.result .row2:hover{background:#f4f7fd}
.result .row2.blocked{opacity:.55}
.chosen{display:flex;gap:8px;align-items:center;padding:7px 12px;background:#f4f7fd;border:1px solid #e2e6ee;border-radius:8px;margin-top:6px}
.chosen input{width:80px}
.tag{color:#8a93a3;font-size:12px}
.attrs{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:13px}
.attrs div:nth-child(odd){color:#8a93a3}
table.bag input{width:96px;padding:4px 6px}
.pill.unknown{background:#fff7e8;color:#9a6b00}
.pill.worn{background:#e8f0fe;color:#2f6fed}
.pill.no{background:#fdf0f0;color:#c22b30}
.pill.raw{background:#f0f2f7;color:#8a93a3}
.eq-grid{display:flex;flex-wrap:wrap;gap:8px}
.eq-slot{width:100%;height:52px;border:1px solid #d5dae4;border-radius:6px;background:#f8fafd;cursor:pointer;text-align:center;padding:4px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}.eq-slot-name{font-size:10px;color:#9aa3b2}.eq-slot-short{font-size:11px;color:#1f2430;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-slot:hover{border-color:#2f6fed;background:#e8f0fe}
.char-title{font-size:18px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #2f6fed}
.char-lv{color:#2f6fed}
.char-body{display:flex;gap:16px;align-items:stretch}
.eq-col{display:flex;flex-direction:column;gap:8px;width:110px;flex:none}
.char-center{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.char-portrait{height:230px;border:1px dashed #c5cdd9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9aa3b2;background:#f8fafd;font-size:13px;flex:none}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.attr-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 4px;border-bottom:1px solid #f0f2f6}
.attr-label{color:#5b6472}
.attr-val{color:#1f2430;font-weight:600;font-variant-numeric:tabular-nums}
.rolebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rolebar .role{background:#fff;border:1px solid #e2e6ee;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:#3a4250}
.rolebar .role:hover{border-color:#2f6fed}
.rolebar .role.active{background:#e8f0fe;border-color:#2f6fed;color:#2f6fed;font-weight:600}
.empty{padding:40px 20px;text-align:center;color:#9aa3b2;background:#fff;border:1px dashed #d5dae4;border-radius:10px}

/* Toast 反馈区 */
.toast-area{position:fixed;right:20px;bottom:20px;width:360px;max-height:70vh;overflow:auto;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:#1f2430;color:#fff;border-radius:8px;padding:11px 14px;font-size:13px;box-shadow:0 6px 20px rgba(10,20,40,.25);animation:tin .18s ease}
.toast.ok{border-left:4px solid #21b85b}
.toast.err{border-left:4px solid #e5484d}
.toast.warn{border-left:4px solid #f0a020}
.toast.info{border-left:4px solid #2f6fed}
.toast .t-sub{color:#aab6c8;font-size:12px;margin-top:4px}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">DFO 115us 管理台<small>GM Console · v1 Dashboard</small></div>
    <nav class="nav" id="nav">
      <div class="nav-item" data-view="accounts"><span class="ico">👤</span>账号管理</div>
      <div class="nav-item" data-view="characters"><span class="ico">⚔️</span>角色管理</div>
      <div class="nav-item" data-view="bag"><span class="ico">🎒</span>装备栏管理</div>
      <div class="nav-item" data-view="quests"><span class="ico">📜</span>任务管理</div>
      <div class="nav-item" data-view="mail"><span class="ico">📧</span>邮件系统</div>
      <div class="nav-item" data-view="items"><span class="ico">🎒</span>物品管理</div>
      <div class="nav-item" data-view="server"><span class="ico">🖥️</span>服务器控制</div>
      <div class="nav-item" data-view="settings"><span class="ico">⚙️</span>系统设置</div>
    </nav>
    <div class="foot">全部数据经由本地 gmweb API</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">工作台</div>
      <div class="topbar-right">
        <span class="health" id="health"><span class="dot"></span><span id="healthText">检测中…</span></span>
        <span class="gm-info" id="gmInfo">GM：未选择账号</span>
        <button class="btn sm" id="refreshBtn">一键刷新</button>
      </div>
    </header>
    <div class="searchbar">
      <input id="globalSearch" placeholder="搜索：输入角色名或账号ID，回车查询" autocomplete="off">
      <button class="btn" id="searchBtn">搜索</button>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"><div class="empty">正在载入管理台…</div></div>
  </div>
</div>
<div class="toast-area" id="toastArea"></div>

<script>
var TOKEN = "__TOKEN__";
var state = {
  account:0, accountName:"", character:null, cera:0, chars:[],
  itemType:"", slot:"", levelMin:0, levelMax:0, rarity:"", filters:null,
  mailTypes:null, mailFilters:null,
  mailType:"", mailSlot:"", mailLevelMin:0, mailLevelMax:0, mailRarity:"",
  pendingMailQuery:"",
  avatarJob:"swordman", avatarSets:[], avatarDetail:null, avatarType:1,
  equipCategory:"", equipArmor:"",
  equipSets:[], equipDetail:null, equipVersion:0,
  equipCats:["armor", "accessory", "special", "weapon"],
  detail:null, bag:[], quests:{}, limits:{},
  attrOpen:false, grantableOnly:true,
  types:null, accounts:[], searchIndex:[], overview:null,
  view:"accounts", subTab:0, health:"checking", bagAuto:true,
  bagGroup:0, bagSub:0
};

var RARITY_COLORS = ["#cfd6e4","#6fc3ff","#b07cf5","#ff8fd0","#ffc85c","#ff9d6b","#ff8a3d","#ff5f5f","#7ef9ff"];

var AVATAR_JOBS = [
  {key:"swordman", label:"男鬼剑/黑暗武士"},
  {key:"atswordman", label:"女鬼剑"},
  {key:"fighter", label:"女格斗"},
  {key:"atfighter", label:"男格斗"},
  {key:"gunner", label:"女枪手"},
  {key:"atgunner", label:"男枪手"},
  {key:"mage", label:"女法师/缔造者"},
  {key:"atmage", label:"男法师"},
  {key:"priest", label:"男圣职"},
  {key:"atpriest", label:"女圣职"},
  {key:"thief", label:"暗夜使者"},
  {key:"knight", label:"骑士"},
  {key:"demonic_lancer", label:"魔枪士"},
  {key:"gun_blader", label:"刃影"},
  {key:"archer", label:"弓箭手"}
];

// 装备套装职业列表（男女合并，因为装备目录共用）
var EQUIP_JOBS = [
  {key:"swordman", label:"鬼剑士"},
  {key:"fighter", label:"格斗家"},
  {key:"gunner", label:"神枪手"},
  {key:"mage", label:"魔法师"},
  {key:"priest", label:"圣职者"},
  {key:"thief", label:"暗夜使者"},
  {key:"knight", label:"骑士"},
  {key:"demonic_lancer", label:"魔枪士"},
  {key:"gun_blader", label:"刃影"},
  {key:"archer", label:"弓箭手"}
];

function api(path, opts){
  opts = opts || {};
  var url = path + (path.indexOf("?")>=0 ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
  if (opts.body) { opts.headers = {"Content-Type":"application/json"}; opts.body = JSON.stringify(opts.body); }
  return fetch(url, opts).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; });
  });
}
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

// ================= 操作反馈（右下角 Toast） =================
function toast(msg, type, sub){
  var area = el("toastArea");
  var t = document.createElement("div");
  t.className = "toast " + (type||"info");
  t.innerHTML = msg + (sub ? "<div class=\"t-sub\">" + sub + "</div>" : "");
  area.appendChild(t);
  setTimeout(function(){ t.classList.add("out"); }, 5200);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 5600);
  while(area.children.length > 6) area.removeChild(area.firstChild);
}

// ================= 服务端连接状态 =================
function pingServer(){
  api("/api/overview").then(function(o){
    state.health = "ok"; state.overview = o;
    var h = el("health");
    h.className = "health ok";
    el("healthText").textContent = "服务端已连接 · 物品索引 " + o.items + " 件";
    if(!state.accounts.length){ loadAccounts(); }
    updateGmInfo();
  }).catch(function(e){
    state.health = "bad";
    var h = el("health");
    h.className = "health bad";
    el("healthText").textContent = "连接失败：" + (e.message||"");
  });
}

function updateGmInfo(){
  var g = el("gmInfo");
  if(!g) return;
  if(state.accountName){
    g.innerHTML = "GM：<b>" + esc(state.accountName) + "</b> · 点券 " + state.cera;
  } else {
    g.innerHTML = "GM：<b>未选择账号</b>";
  }
}

// ================= 账号与角色数据 =================
function loadAccounts(){
  api("/api/overview").then(function(o){
    state.overview = o;
    state.accounts = o.accounts || [];
    state.searchIndex = [];
    var tasks = state.accounts.map(function(a){
      return api("/api/characters?account=" + a.id).then(function(cc){
        a.cera = cc.cera;
        a.roleCount = (cc.characters||[]).length;
        (cc.characters||[]).forEach(function(ch){
          state.searchIndex.push({type:"character", id:ch.id, accountId:a.id, accountName:a.username, name:ch.name, level:ch.level, className:ch.class_name, gold:ch.gold});
        });
        state.searchIndex.push({type:"account", id:a.id, name:a.username});
      }).catch(function(){ a.cera = null; a.roleCount = 0; });
    });
    Promise.all(tasks).then(function(){
      if(state.view === "accounts") renderView();
      if(state.view === "items") refreshItemsView();
      updateGmInfo();
    });
  }).catch(function(e){ toast("读取账号列表失败：" + esc(e.message), "err"); });
}

function selectAccount(id, name, keepView){
  state.account = id; state.accountName = name;
  state.character = null; state.detail = null; state.bag = []; state.quests = {}; state.limits = {};
  api("/api/characters?account=" + id).then(function(o){
    state.cera = o.cera; state.chars = o.characters || [];
    updateGmInfo();
    if(state.view === "characters" || (state.view === "items")) renderView();
    if(!keepView){ switchView("characters"); }
  }).catch(function(e){ toast("加载角色失败：" + esc(e.message), "err"); });
}

function selectCharacter(id){
  api("/api/character?id=" + id).then(function(o){
    state.character = o.character; state.cera = o.cera;
    state.detail = o; state.bag = o.bag || []; state.quests = o.quests || {}; state.limits = o.limits || {};
    updateGmInfo();
    if(state.view === "characters" || state.view === "quests" || state.view === "items" || state.view === "bag"){
      renderView();
    } else {
      switchView("characters");
    }
    toast("已载入角色「" + esc(o.character.name) + "」Lv." + o.character.level, "info");
  }).catch(function(e){ toast("载入角色失败：" + esc(e.message), "err"); });
}

// ================= 全局搜索 =================
function doGlobalSearch(){
  var q = el("globalSearch").value.trim();
  var box = el("searchResults");
  if(!q){ box.style.display = "none"; return; }
  var n = parseInt(q, 10);
  var low = q.toLowerCase();
  var res = state.searchIndex.filter(function(e){
    if(e.type === "character"){
      return (e.name.toLowerCase().indexOf(low) >= 0) || (n && (e.id === n || e.accountId === n));
    }
    return (e.name.toLowerCase().indexOf(low) >= 0) || (n && e.id === n);
  }).slice(0, 40);
  if(!res.length){
    box.innerHTML = "<div class=\"sr\"><span>没有匹配的账号或角色</span></div>";
  } else {
    box.innerHTML = res.map(function(e){
      if(e.type === "character"){
        return "<div class=\"sr\" data-k=\"c" + e.id + "\"><span>⚔️ " + esc(e.name) +
          " <span class=\"k\">" + esc(e.className) + " · Lv." + e.level + " · 账号 " + esc(e.accountName) + "</span></span>" +
          "<span class=\"k\">角色ID " + e.id + "</span></div>";
      }
      return "<div class=\"sr\" data-k=\"a" + e.id + "\"><span>👤 " + esc(e.name) + "</span><span class=\"k\">账号ID " + e.id + "</span></div>";
    }).join("");
  }
  box.style.display = "block";
  Array.prototype.forEach.call(box.querySelectorAll(".sr"), function(node){
    node.onclick = function(){
      var k = node.dataset.k;
      box.style.display = "none";
      if(k.charAt(0) === "a"){
        var id = parseInt(k.slice(1), 10);
        var acc = state.accounts.filter(function(a){ return a.id === id; })[0];
        selectAccount(id, acc ? acc.username : String(id), false);
      } else {
        var cid = parseInt(k.slice(1), 10);
        var hit = state.searchIndex.filter(function(e){ return e.type === "character" && e.id === cid; })[0];
        if(hit){
          if(state.account !== hit.accountId){
            api("/api/characters?account=" + hit.accountId).then(function(o){
              state.account = hit.accountId; state.accountName = hit.accountName;
              state.cera = o.cera; state.chars = o.characters || [];
              selectCharacter(cid);
              switchView("characters");
            });
          } else {
            selectCharacter(cid);
            switchView("characters");
          }
        }
      }
    };
  });
}

var VIEW_TITLES = {accounts:"账号管理", characters:"角色管理", bag:"背包装备", quests:"任务管理", items:"物品管理", server:"服务器控制", settings:"系统设置"};
function switchView(v){
  state.view = v;
  state.subTab = 0;
  Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function(n){
    n.classList.toggle("active", n.dataset.view === v);
  });
  el("pageTitle").textContent = VIEW_TITLES[v] || "工作台";
  try { if(location.hash !== "#" + v) history.replaceState(null, "", "#" + v); } catch(e){}
  if(v !== "bag") stopBagAuto();
  renderView();
  if(v === "bag" && state.bagAuto) startBagAuto();
}
function renderTabs(tabs){
  var box = el("tabs");
  if(!tabs || !tabs.length){ box.innerHTML = ""; return; }
  box.innerHTML = tabs.map(function(t, i){
    return "<div class=\"tab" + (state.subTab === i ? " on" : "") + "\" data-i=\"" + i + "\">" + esc(t) + "</div>";
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll(".tab"), function(n){
    n.onclick = function(){ state.subTab = parseInt(n.dataset.i, 10); renderView(); };
  });
}
function renderView(){
  var v = state.view;
  if(v === "accounts") renderAccountsView();
  else if(v === "characters") renderCharactersView();
  else if(v === "bag") renderBagView();
  else if(v === "quests") renderQuestsView();
  else if(v === "mail") renderMailView();
  else if(v === "items") renderItemsView();
  else if(v === "server") renderServerView();
  else if(v === "settings") renderSettingsView();
}

    if(f && /^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)) return; // 编辑中不打扰
    if(!state.character || state.view !== "bag") return;
    api("/api/character?id=" + state.character.id).then(function(o){
      if(!state.character || o.character.id !== state.character.id) return;
      state.character = o.character; state.detail = o;
      state.bag = o.bag || []; state.quests = o.quests || {}; state.limits = o.limits || {};
      renderBagView();
    }).catch(function(){});
  }, 8000);
}
function stopBagAuto(){ if(bagAutoTimer){ clearInterval(bagAutoTimer); bagAutoTimer = null; } }

var BAG_GROUPS = [
  {key:"物品栏", subs:["装备","消耗品","材料","副职业","任务","其它"]},
  {key:"装扮", subs:["装扮","徽章","其它"]},
  {key:"宠物", subs:["宠物","宠物装备","消耗品","其它"]}
];
function bagRowCat(b){
  if(b.category) return b.category;
  return b.section === "items" ? {group:"物品栏", sub:"消耗品"} : {group:"物品栏", sub:"装备"};
}
function bagTabsHTML(){
  var g = BAG_GROUPS[state.bagGroup] || BAG_GROUPS[0];
  return "<div class=\"tabs\" id=\"bag_g_tabs\">" + BAG_GROUPS.map(function(grp, i){
    return "<div class=\"tab" + (i === state.bagGroup ? " active" : "") + "\" data-bg=\"" + i + "\">" + grp.key + "</div>";
  }).join("") + "</div>" +
  "<div class=\"tabs sub\" id=\"bag_s_tabs\">" + g.subs.map(function(s, i){
    return "<div class=\"tab" + (i === state.bagSub ? " active" : "") + "\" data-bs=\"" + i + "\">" + s + "</div>";
  }).join("") + "</div>";
}
function bindBagTabs(){
  Array.prototype.forEach.call(document.querySelectorAll("#bag_g_tabs .tab"), function(t){
    t.onclick = function(){
      state.bagGroup = parseInt(t.dataset.bg, 10) || 0;
      state.bagSub = 0;
      renderView();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#bag_s_tabs .tab"), function(t){
    t.onclick = function(){
      state.bagSub = parseInt(t.dataset.bs, 10) || 0;
      renderView();
    };
  });
}

function renderBagView(){

    "<label style=\"font-size:12px;font-weight:400\"><input type=\"checkbox\" id=\"bag_auto\"" + (state.bagAuto ? " checked" : "") + " style=\"width:auto\"> 自动刷新(8秒)</label></div>" +
  "</div>";

    c.innerHTML = charBar + "<div class=\"empty\">该账号还没有角色。</div>";

  if(!state.character){
    c.innerHTML = charBar + "<div class=\"empty\">请从下拉选择角色。</div>";

    if(bs) bs.onchange = function(){ if(this.value) selectCharacter(parseInt(this.value, 10)); };
    return;
  }
  var grpKey = BAG_GROUPS[state.bagGroup].key;
  var subKey = BAG_GROUPS[state.bagGroup].subs[state.bagSub];
  var secLabel = {"items":"背包", "worn":"已穿戴", "equipment":"装备"};
  var rows = state.bag.filter(function(b){

    if(subKey === "其它") return cat.sub === "其它";

  });

    ? false : true;

  var hintText = stackLike
    ? "可堆叠物品：输入数量点「设为」，或点 +1/−1。"
    : "不可堆叠物品：改耐久（0=0耐久）。发放道具请去邮件系统。";

  var header = "<div class=\"card\"><h3>" + esc(state.character.name) + " · Lv." + state.character.level + " · " + subKey + " · " + rows.length + " 行</h3>" +
    "<div class=\"hint\">" + hintText + "</div></div>";

  if(!rows.length){
    c.innerHTML = charBar + bagTabsHTML() + header + "<div class=\"empty\">「" + subKey + "」没有物品。</div>";
    bindBagTabs(); bindBagHeader();
    var bs0 = el("bag_char_sel");
    if(bs0) bs0.onchange = function(){ if(this.value) selectCharacter(parseInt(this.value, 10)); };
    return;
  }

  c.innerHTML = charBar + bagTabsHTML() + header +
  "<div class=\"card\"><table class=\"bag\" style=\"width:100%\"><thead><tr>" +
    "<th style=\"width:40px\"><input type=\"checkbox\" id=\"bag_all\"></th>" +
    "<th style=\"width:60px\">槽位</th><th style=\"width:140px\">ID</th><th>名称</th>" +
    "<th style=\"width:80px\">操作</th>" +
  "</tr></thead><tbody>" + rows.map(function(b){
    var sec = b.section;
    var flag = b.flag === "unknown" ? " <span class=\"pill unknown\">?</span>" : "";
    var worn = b.worn ? " <span class=\"pill worn\">已穿戴</span>" : "";
    return "<tr data-sec=\"" + sec + "\" data-slot=\"" + b.slot + "\">" +
      "<td><input type=\"checkbox\" class=\"bagpick\"></td>" +
      "<td>" + b.slot + "</td>" +
      "<td>" + b["template"] + "</td>" +
      "<td>" + esc(b.name) + flag + worn + "</td>" +
      "<td><button class=\"btn ghost sm bag-del-one\" style=\"color:#e74c3c;border-color:#e74c3c\">删除</button></td>" +
    "</tr>";
  }).join("") + "</tbody></table>" +
  "<div style=\"margin-top:12px;display:flex;gap:10px;align-items:center\">" +
    "<button id=\"bag_del_sel\" class=\"btn ghost\" style=\"color:#e74c3c;border-color:#e74c3c\">删除选中</button>" +
    "<span id=\"bag_sel\" class=\"hint\">已选 0 件</span>" +
  "</div></div>";
  bindBagTabs(); bindBagHeader();
  // 全选
  var all = el("bag_all");
  if(all) all.onchange = function(){
    document.querySelectorAll(".bagpick").forEach(function(cb){ cb.checked = all.checked; });
    updateBagSelCount();
  };
  // 单选计数
  document.querySelectorAll(".bagpick").forEach(function(cb){
    cb.onchange = updateBagSelCount;
  });
  // 单件删除
  document.querySelectorAll(".bag-del-one").forEach(function(btn){
    btn.onclick = function(){
      var tr = btn.closest("tr");
      var sec = tr.dataset.sec;
      var slot = parseInt(tr.dataset.slot, 10);
      doRemoveEquip(sec, [slot]);
    };
  });
  // 批量删除
  var delSel = el("bag_del_sel");
  if(delSel) delSel.onclick = function(){
    var sec = null;
    var slots = [];
    document.querySelectorAll(".bagpick:checked").forEach(function(cb){
      var tr = cb.closest("tr");
      sec = tr.dataset.sec;
      slots.push(parseInt(tr.dataset.slot, 10));
    });
    if(!slots.length){ alert("请先勾选要删除的装备"); return; }
    if(!confirm("确定删除选中的 " + slots.length + " 件装备？")) return;
    doRemoveEquip(sec, slots);
  };
  var bs1 = el("bag_char_sel");
  if(bs1) bs1.onchange = function(){ if(this.value) selectCharacter(parseInt(this.value, 10)); };
}

function updateBagSelCount(){
  var n = document.querySelectorAll(".bagpick:checked").length;
  var s = el("bag_sel");
  if(s) s.textContent = "已选 " + n + " 件";
}

function doRemoveEquip(section, slots){
  var body = JSON.stringify({character_id: state.character.id, section: section, slots: slots});
  fetch("/api/equip/remove?token=" + encodeURIComponent(state.token), {method:"POST", headers:{"Content-Type":"application/json"}, body:body})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){
        alert("已删除 " + (d.removed || 0) + " 件。\n\n请返回角色选择界面重新进游戏（小退重登）查看变化。");
        selectCharacter(state.character.id);
      } else {
        alert("删除失败：" + (d.error || "未知错误"));
      }
    })
    .catch(function(e){ alert("请求失败：" + e); });
}

var mailTarget = "bag";   // bag / vault / mail
var mailAmount = 1;

      "<input id=\"mail_q\" placeholder=\"搜索道具：代码 / 中文名 / 英文名（如 10300000、太初、普拉塔尼）\" style=\"flex:1;min-width:0;padding:7px 10px;border:1px solid #d0d7e2;border-radius:4px\">" +

    renderMailTypes();
  }).catch(function(e){

  });
}

function renderMailTypes(){
  var box = el("mail_types"); if(!box || !state.mailTypes) return;
  var html = kw("mailtype", "", "全部", "", state.mailType, null);
  state.mailTypes.forEach(function(t){
    if(!isOutfitKeep(t.label)) return;
    html += kw("mailtype", t.key, t.label, t.count, state.mailType, null);
    (t.children||[]).forEach(function(c2){
      if(!isOutfitKeep(c2.label)) return;
      html += kw("mailtype", c2.key, c2.label, c2.count, state.mailType, null, true);
    });
  });
  box.innerHTML = html;
  bindKws(box, "mailtype", function(v){
    state.mailType = v; renderMailTypes(); mailSearch();
  });

function loadMailFilters(){
  api("/api/filters").then(function(f){
    state.mailFilters = f;
    renderMailSlots(); renderMailLevels(); renderMailRarities();
  }).catch(function(e){
    var box = el("mail_slots");
    if(box) box.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>";
  });
}

function renderMailSlots(){
  var box = el("mail_slots"); if(!box || !state.mailFilters) return;
  var html = kw("mailslot", "", "全部", state.mailFilters.equipment, state.mailSlot, null);

function renderMailLevels(){

  });

  bindKws(box, "mailrarity", function(v){
    state.mailRarity = v; renderMailRarities(); mailSearch();

function mailSearch(){
  var q = el("mail_q"); if(!q) return;
  var params = ["q=" + encodeURIComponent(q.value), "grantable=1", "limit=20"];
  if(state.mailType) params.push("type=" + encodeURIComponent(state.mailType));
  if(state.mailSlot) params.push("slot=" + encodeURIComponent(state.mailSlot));
  if(state.mailRarity) params.push("rarity=" + encodeURIComponent(state.mailRarity));
  if(state.mailLevelMin) params.push("level_min=" + state.mailLevelMin);
  if(state.mailLevelMax) params.push("level_max=" + state.mailLevelMax);
  var url = "/api/items?" + params.join("&");
  api(url).then(function(o){
    var res = el("mail_res");
    if(!res) return;
    res.innerHTML = o.items.map(function(it){
      var color = RARITY_COLORS[it.rarity] || "#1f2430";
      var nm = it.name || it.name_en || "(未命名)";
      var cat = it.category ? " <span class=\"pill cat\">" + esc(it.category.group) + "/" + esc(it.category.sub) + "</span>" : "";
      var flags = it.stackable ? " <span class=\"pill green\">可堆叠</span>" : " <span class=\"pill gray\">不可堆叠</span>";
      var r = it.restrictions || {};
      if(!r.bag) flags += " <span class=\"pill\" style=\"background:#fde8e8;color:#c0392b\">不可发背包</span>";
      if(!r.mail) flags += " <span class=\"pill\" style=\"background:#fde8e8;color:#c0392b\">不可发邮箱</span>";
      if(!r.vault) flags += " <span class=\"pill\" style=\"background:#fde8e8;color:#c0392b\">不可入仓库</span>";
      var parts = ["ID " + it.id];
      if(it.level) parts.push("Lv" + it.level);
      if(it.rarity_label) parts.push(it.rarity_label);
      return "<div class=\"row2\" data-id=\"" + it.id + "\">" +
        "<span><span class=\"nm\" style=\"color:" + color + "\">" + esc(nm) + "</span>" + cat + flags +
        "<div class=\"tag\">" + esc(parts.join(" · ")) + "</div></span>" +
        "<span class=\"tag\">" + esc(it.type_label || it.slot || "普通") + "</span></div>";
    }).join("") || "<div class=\"row2\">没有匹配的道具</div>";
    Array.prototype.forEach.call(res.querySelectorAll(".row2"), function(n){
      n.onclick = function(){
        var id = parseInt(n.dataset.id, 10);
        var it = o.items.filter(function(x){ return x.id === id; })[0];
        if(it) selectMailItem(it);
      };
    });
  }).catch(function(e){
    var res = el("mail_res");
    if(res) res.innerHTML = "<div class=\"row2\"><span class=\"err\">" + esc(e.message) + "</span></div>";
  });
}

function selectMailItem(it){
  mailSel = it;
  mailAmount = 1;
  var r = it.restrictions || {};
  // 当前目标不可用或未设置时，回退到第一个可用目标
  var okMap = {bag: r.bag, vault: r.vault, mail: r.mail};
  if(!okMap[mailTarget]) mailTarget = r.bag ? "bag" : (r.vault ? "vault" : "mail");
  var card = el("mail_selcard");
  if(!card) return;
  var color = RARITY_COLORS[it.rarity] || "#1f2430";
  var rpart = function(k, label){
    if(r[k]) return label + " ✓";
    return label + " ✗" + (r.reasons && r.reasons[k] ? "（" + esc(r.reasons[k]) + "）" : "");
  };
  card.innerHTML =
    "<h3>发送设置 <span class=\"sub\">" + esc(it.name || it.name_en) + " · ID " + it.id + (it.category ? " · " + esc(it.category.group) + "/" + esc(it.category.sub) : "") + "</span></h3>" +
    "<div class=\"hint\"><span style=\"color:" + color + "\">" + esc(it.name || it.name_en) + "</span>" + (it.stackable ? "（可堆叠）" : "（不可堆叠）") + "<br>目标限制：" + rpart("bag", "背包") + " ｜ " + rpart("vault", "个人仓库") + " ｜ " + rpart("mail", "邮箱") + "</div>" +
    "<div class=\"row\" style=\"margin-top:12px\"><div style=\"flex:1\"><label>发送数量</label><input id=\"mail_amount\" type=\"number\" min=\"1\" max=\"999999\" value=\"1\"></div>" +
    "<div style=\"flex:2\"><label>发送到（必选）</label><div id=\"mail_targets\" style=\"display:flex;gap:8px\">" +
      "<button type=\"button\" data-tg=\"bag\" class=\"btn " + (mailTarget === "bag" ? "" : "ghost") + "\" style=\"flex:1\" " + (r.bag ? "" : "disabled") + ">背包</button>" +
      "<button type=\"button\" data-tg=\"vault\" class=\"btn " + (mailTarget === "vault" ? "" : "ghost") + "\" style=\"flex:1\" " + (r.vault ? "" : "disabled") + ">个人仓库</button>" +
      "<button type=\"button\" data-tg=\"mail\" class=\"btn " + (mailTarget === "mail" ? "" : "ghost") + "\" style=\"flex:1\" " + (r.mail ? "" : "disabled") + ">邮箱</button>" +
    "</div></div></div>" +
    "<div class=\"hint\" style=\"margin-top:10px\">强化 / 增幅 / 锻造：服务端装备实例协议暂未支持（阶段 2 逆向客户端协议后启用），当前发送为初始装备。</div>" +
    "<div class=\"actions\" style=\"margin-top:12px\"><button id=\"mail_send\" class=\"btn\">发送</button> <span id=\"mail_msg\" class=\"hint\"></span></div>";
  var amt = el("mail_amount");
  if(amt) amt.onchange = function(){ mailAmount = Math.max(1, parseInt(amt.value, 10) || 1); };
  Array.prototype.forEach.call(document.querySelectorAll("#mail_targets [data-tg]"), function(t){
    t.onclick = function(){
      mailTarget = t.dataset.tg;
      selectMailItem(mailSel);
    };
  });
  var send = el("mail_send");
  if(send) send.onclick = doMailSend;
}

function doMailSend(){
  if(!mailSel){ toast("请先选择物品", "warn"); return; }
  var msg = el("mail_msg");
  if(msg) msg.textContent = "发送中…";
  var body = { account: state.account || 1, template: mailSel.id, amount: mailAmount };
  var url = mailTarget === "bag" ? "/api/grant" : (mailTarget === "vault" ? "/api/vault/send" : "/api/mail/send");
  if(mailTarget === "bag"){
    body.character = state.character ? state.character.id : 1;
    body.gold = 0; body.cera = 0; body.reason = "GM 邮件系统-背包发放";
    body.items = [{template: mailSel.id, amount: mailAmount}];
  } else if(mailTarget === "vault"){
    body.character = state.character ? state.character.id : 1;
  } else {
    body.to_account_id = state.account || 1;
    body.to_character_id = state.character ? state.character.id : 0;
    body.title = "GM 发放：" + (mailSel.name || mailSel.id);
    body.body = "GM 管理台邮件系统发放";
  }
  api(url, {method:"POST", body: body}).then(function(o){
    if(msg) msg.innerHTML = "<span class=\"ok\">" + esc(o.message || "发送成功") + "</span>";
    toast("发送成功 → " + (mailTarget === "bag" ? "背包" : mailTarget === "vault" ? "个人仓库" : "邮箱"), "ok");
    mailAmount = 1;
    var amt = el("mail_amount"); if(amt) amt.value = "1";
  }).catch(function(e){
    if(msg) msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>";
    toast("发送失败：" + e.message, "err");
  });
}

function renderMailAvatar(c){

async function sendAvatarSet(target){
  if(!state.character){
    toast("请先在顶部选择目标角色", "warn");
    return;
  }
  if(!state.avatarDetail || !state.avatarType) return;
  var curType = null;
  state.avatarDetail.types.forEach(function(t){ if(t.type_index === state.avatarType) curType = t; });
  if(!curType) return;

  var items = [];
  var box = el("avatar_detail");
  Array.prototype.forEach.call(box.querySelectorAll(".avatar-item-cb:checked"), function(cb){
    items.push(parseInt(cb.dataset.id, 10));
  });
  if(!items.length){ toast("请至少勾选一件物品", "warn"); return; }

  var msg = el("avatar_send_msg");
  var targetName = target === "bag" ? "背包" : (target === "vault" ? "仓库" : "邮箱");
  if(!confirm("将发放 " + items.length + " 件物品到" + targetName + "，确认？")) return;

  var ok = 0, fail = 0;
  var account = state.account;
  var character = state.character.id;

  for(var i = 0; i < items.length; i++){
    if(msg) msg.textContent = "发放中… " + (i + 1) + "/" + items.length;
    var id = items[i];
    try{
      if(target === "bag"){
        await api("/api/grant", {method:"POST", body:{
          account: account, character: character, gold: 0, cera: 0,
          reason: "GM 时装套装发放",
          items: [{template: id, amount: 1}]
        }});
      } else if(target === "vault"){
        await api("/api/vault/send", {method:"POST", body:{
          account: account, character: character, template: id, amount: 1
        }});
      } else {
        await api("/api/mail/send", {method:"POST", body:{
          to_account_id: account, to_character_id: character,
          title: "GM 发放：时装套装", body: "GM 管理台时装套装发放",
          template: id, amount: 1
        }});
      }
      ok++;
    }catch(e){
      fail++;
    }
  }

  if(msg) msg.innerHTML = "<span class=\"ok\">完成：成功 " + ok + " 件，失败 " + fail + " 件</span>";
  toast("发放完成：成功 " + ok + "，失败 " + fail, fail > 0 ? "warn" : "ok");
}

function normalizeStr(s){
  if(!s) return "";
  return s.toString()
    .replace(/\s+/g, "")
    .replace(/[·:：]/g, "")
    .toLowerCase();
}

function renderEquipDetail(){
  var box = el("equip_detail");
  if(!box || !state.equipDetail) return;
  var d = state.equipDetail;

  var maxVer = 1;
  var hasAny = false;
  for(var p in d.parts){
    var items = d.parts[p];
    if(!items || items.length === 0) continue;
    hasAny = true;
    if(items.length > maxVer) maxVer = items.length;
  }
  if(!hasAny) maxVer = 1;
  if(maxVer < 1) maxVer = 1;

  if(state.equipVersion >= maxVer) state.equipVersion = 0;

  var verOptions = "";
  for(var i = 0; i < maxVer; i++){
    var allHave = true;
    for(var p in d.parts){
      var items = d.parts[p];
      if(items && items.length > 0 && i >= items.length){ allHave = false; break; }
    }
    var label = "版本 " + (i+1);
    if(!allHave) label += "（部分部位无）";
    verOptions += "<option value=\"" + i + "\"" + (i === state.equipVersion ? " selected" : "") + ">" + label + "</option>";
  }

  var cats = [
    {key:"armor", label:"防具", parts:["coat", "pants", "shoulder", "belt", "shoes"]},
    {key:"accessory", label:"首饰", parts:["neck", "wrist", "ring", "earring"]},
    {key:"special", label:"特殊装备", parts:["support", "magicstone"]},
    {key:"weapon", label:"武器", parts:[]}
  ];
  for(var p in d.parts){
    if(p.indexOf("weapon_") === 0) cats[3].parts.push(p);
  }

  var catHtml = "";
  var totalItems = 0;
  cats.forEach(function(c){
    var cnt = 0;
    c.parts.forEach(function(p){
      if(d.parts[p] && d.parts[p].length > 0) cnt++;
    });
    var checked = state.equipCats.indexOf(c.key) >= 0 ? "checked" : "";
    if(state.equipCats.indexOf(c.key) >= 0) totalItems += cnt;
    catHtml += "<label style=\"display:inline-block; margin-right:16px\"><input type=\"checkbox\" class=\"equip-cat-cb\" data-cat=\"" + c.key + "\" " + checked + "> " + c.label + " (" + cnt + " 件)</label>";
  });

  var partTable = "<table style=\"width:100%; margin-top:8px; font-size:12px\"><thead><tr><th>部位</th><th>装备名</th><th>ID</th></tr></thead><tbody>";

    var items = d.parts[p];
    if(!items || items.length === 0) continue;
    var hasVer = state.equipVersion < items.length;
    var idx = hasVer ? state.equipVersion : items.length - 1;
    var item = items[idx];
    var suffix = hasVer ? "" : "（无此版本，回退到最高）";
    partTable += "<tr><td>" + p + "</td><td>" + esc(item.name || "—") + suffix + "</td><td>" + item.id + "</td></tr>";
  }
  partTable += "</tbody></table>";

  var fallbackParts = [];
  for(var p in d.parts){
    var items = d.parts[p];
    if(!items || items.length === 0) continue;
    if(state.equipVersion >= items.length) fallbackParts.push(p);
  }

  var fallbackHtml = "";
  if(fallbackParts.length > 0){
    fallbackHtml = "<div style=\"margin:8px 0; padding:8px; background:#fff3cd; border-radius:6px; color:#856404\">⚠ 本次发放将回退以下部位（无版本 " + (state.equipVersion+1) + "）：" + fallbackParts.join("、") + "</div>";
  }

  box.innerHTML =
    "<h3>" + esc(d.name || "套装") + " <span class=\"hint\" style=\"font-size:13px\">(" + (d.armor_type || "") + (d.is_exclusive ? " · 职业专属" : " · 通用") + ")</span></h3>" +
    "<div style=\"margin:8px 0\">" +
      "<label style=\"display:inline-block; margin-right:16px\"><span style=\"color:#888\">版本：</span><select id=\"equip_ver_sel\" style=\"width:auto\">" + verOptions + "</select></label>" +
    "</div>" +
    "<div style=\"margin:8px 0; padding:8px; background:#f8fafd; border-radius:6px\">" +
      "<b>发放类别：</b><br>" + catHtml +
    "</div>" +
    fallbackHtml +
    partTable +
    "<div style=\"margin-top:12px\">" +
      "<span style=\"color:#888\">发放到：</span>" +
      "<select id=\"equip_target_sel\" style=\"width:auto;margin-right:8px\">" +
        "<option value=\"bag\">背包</option>" +
        "<option value=\"vault\">仓库</option>" +
        "<option value=\"mail\" disabled>邮箱（暂未支持）</option>" +
      "</select>" +
      "<button class=\"btn\" id=\"equip_grant_btn\">发放</button>" +
      " <span class=\"hint\" id=\"equip_count_hint\">已选 " + totalItems + " 件</span>" +
    "</div>" +
    "<div class=\"hint\" style=\"color:#888;margin-top:8px\">" +
      "⚠ 发放后请退到角色选择界面，重新进入游戏查看新装备。" +
    "</div>" +
    "<div class=\"hint\" style=\"color:#aaa;margin-top:4px\">" +

    "</div>" +
    "<div id=\"equip_grant_msg\" style=\"margin-top:8px; font-size:13px\"></div>";

  var verSel = el("equip_ver_sel");
  if(verSel) verSel.onchange = function(){

    renderEquipDetail();
  };

        toast("请至少选择一个发放类别", "warn");
        return;

// ===== 道具添加（自动堆叠） =====
var addList = [];
var lastStackQuery = "";
function bindStackAdd(){
  var t = el("stack_add_toggle");
  if(t) t.onclick = function(){
    var p = el("stack_add_panel");
    p.style.display = p.style.display === "none" ? "block" : "none";
    t.textContent = p.style.display === "none" ? "＋ 添加道具（自动堆叠）" : "－ 收起添加面板";
  };
  var b = el("stack_btn");
  if(b) b.onclick = stackSearch;
  var q = el("stack_q");
  if(q) q.onkeydown = function(e){ if(e.key === "Enter") stackSearch(); };
  var go = el("stack_only_stackable");
  if(go) go.onchange = stackSearch;
  var d = el("stack_do");
  if(d) d.onclick = doStackAdd;
  // 页面重建（自动刷新/发放后刷新）后恢复搜索结果与待添加列表，避免被重建覆盖
  if(lastStackQuery) stackSearch();
  renderAddList();
}
function stackSearch(){
  window.__stackErr = null;
  var q = el("stack_q"); if(!q){ window.__stackErr = "no-q-element"; return; }
  lastStackQuery = q.value;
  var url = "/api/items?q=" + encodeURIComponent(q.value) + "&grantable=1&limit=30";
  api(url).then(function(o){
    try {
      var only = el("stack_only_stackable").checked;
      var items = o.items.filter(function(it){ return !only || it.stackable; });
      var res = el("stack_res");
      if(!res){ window.__stackErr = "no-res-element"; return; }
      res.innerHTML = items.map(function(it){
        var color = RARITY_COLORS[it.rarity] || "#1f2430";
        var nm = it.name || it.name_en || "(未命名)";
        var stack = it.stackable ? " <span class=\"pill green\">可堆叠</span>" : " <span class=\"pill gray\">不可堆叠</span>";
        var cat = it.category ? " <span class=\"pill cat\">" + esc(it.category.group) + "/" + esc(it.category.sub) + "</span>" : "";
        var parts = ["ID " + it.id];
        if(it.level) parts.push("Lv" + it.level);
        if(it.rarity_label) parts.push(it.rarity_label);
        return "<div class=\"row2\" data-id=\"" + it.id + "\" data-name=\"" + esc(nm) + "\" data-stack=\"" + (it.stackable ? "1" : "0") + "\">" +
          "<span><span class=\"nm\" style=\"color:" + color + "\">" + esc(nm) + "</span>" + stack + cat +
          "<div class=\"tag\">" + esc(parts.join(" · ")) + "</div>" +
          (it.stackable ? "" : "<div class=\"tag warn\">服务端按装备发放，不叠加</div>") + "</span>" +
          "<span class=\"tag\"><span class=\"pill\">" + esc(it.slot || it.type_label || "普通") + "</span></span></div>";
      }).join("") || "<div class=\"row2\">没有匹配的道具</div>";
      Array.prototype.forEach.call(res.querySelectorAll(".row2"), function(n){
        n.onclick = function(){
          addToList(parseInt(n.dataset.id, 10), n.dataset.name, n.dataset.stack === "1");
        };
      });
      var rc = el("stack_count");
      if(rc) rc.textContent = "命中 " + (o.count||0) + "，当前显示 " + items.length + " 条";
    } catch(ex){
      window.__stackErr = "render:" + String(ex && ex.message || ex);
    }
  }).catch(function(e){
    window.__stackErr = "api:" + String(e && e.message || e);
    var res = el("stack_res");
    if(res) res.innerHTML = "<div class=\"row2\"><span class=\"err\">" + esc(e.message) + "</span></div>";
  });
}
function addToList(id, name, stackable){
  for(var i=0;i<addList.length;i++) if(addList[i].id === id){ addList[i].amount++; renderAddList(); return; }
  addList.push({id:id, name:name, amount:1, stackable:stackable});
  renderAddList();
}
function renderAddList(){
  var box = el("stack_chosen"); if(!box) return;
  box.innerHTML = addList.map(function(a,i){
    return "<div class=\"chosen\"><span style=\"flex:1\">" + esc(a.name) + " <span class=\"tag\">ID " + a.id + (a.stackable ? " · 可堆叠" : " · 不可堆叠") + "</span></span>" +
      "<input type=\"number\" min=\"1\" max=\"999999\" value=\"" + a.amount + "\" data-i=\"" + i + "\" style=\"width:90px\">" +
      "<button class=\"btn ghost sm\" data-del=\"" + i + "\">移除</button></div>";
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("input"), function(inp){
    inp.onchange = function(){ addList[parseInt(inp.dataset.i,10)].amount = Math.max(1, parseInt(inp.value,10)||1); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
    b.onclick = function(){ addList.splice(parseInt(b.dataset.del,10),1); renderAddList(); };
  });
}
function doStackAdd(){
  if(!addList.length){ toast("请先选择要添加的道具", "warn"); return; }
  var msg = el("stack_msg");
  if(msg) msg.textContent = "提交中…";
  api("/api/grant", {method:"POST", body:{
    account: state.account, character: state.character.id, gold: 0, cera: 0,
    reason: "GM 道具管理添加", items: addList.map(function(a){ return {template:a.id, amount:a.amount}; })
  }}).then(function(o){
    if(msg) msg.innerHTML = "<span class=\"ok\">" + esc(o.message) + "</span>";
    toast("添加成功，同种道具已自动堆叠", "ok", addList.length + " 种");
    addList = []; lastStackQuery = ""; renderAddList();
    var q = el("stack_q"); if(q) q.value = "";
    var res = el("stack_res"); if(res) res.innerHTML = "";
    selectCharacter(state.character.id);
  }).catch(function(e){
    if(msg) msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>";
    toast("添加失败：" + e.message, "err");
  });
}

function pickedBagRows(){
  return Array.prototype.filter.call(document.querySelectorAll(".bagpick"), function(p){ return p.checked; });
}
function updateBagSel(){
  var n = pickedBagRows().length;
  var s = el("bag_sel");
  if(s) s.textContent = "已选 " + n + " 行";
  var all = el("bag_all");
  if(all) all.checked = n > 0 && n === document.querySelectorAll(".bagpick").length;
}
function bindBagRows(){
  Array.prototype.forEach.call(document.querySelectorAll(".bagpick"), function(p){
    p.onchange = updateBagSel;
  });
  var tbody = document.querySelector("#content table.bag tbody");
  if(!tbody) return;
  tbody.onclick = function(ev){
    var btn = ev.target.closest("button");
    if(!btn || !btn.closest("tr")) return;
    var tr = btn.closest("tr");
    var inp = tr.querySelector(".bag-num");
    var cur = parseInt(tr.dataset.cur, 10) || 0;
    var max = parseInt(inp.max, 10);
    var nv;
    if(btn.classList.contains("bag-inc")){
      nv = Math.min(max, cur + 1);
    } else if(btn.classList.contains("bag-dec")){
      nv = Math.max(0, cur - 1);
    } else if(btn.classList.contains("bag-set")){
      nv = parseInt(inp.value, 10);
      if(isNaN(nv) || nv < 0 || nv > max){ toast("数值需在 0~" + max + " 之间", "warn"); return; }
    } else if(btn.classList.contains("bag-del")){
      nv = 0;
      var nm = tr.querySelector("td:nth-child(5)");
      if(!confirm("删除「" + (nm ? nm.textContent.trim() : "该物品") + "」？数量将设为 0。")) return;
    } else return;
    applyBagEdit(tr, nv);
  };
}
function applyBagEdit(tr, value){
  var edits = [{ section: tr.dataset.sec, slot: parseInt(tr.dataset.slot, 10) }];
  if(tr.dataset.field === "amount") edits[0].amount = value; else edits[0].durability = value;
  stateEditPost("/api/state/bag", {
    account: state.account, character: state.character.id, edits: edits,
    reason: "GM 工具背包装备管理"
  }, "bag_msg", function(){
    selectCharacter(state.character.id);
  });
}
function batchBag(mode){
  var rows = pickedBagRows();
  if(!rows.length){ toast("请先勾选要操作的行", "warn"); return; }
  var n = parseInt(el("bag_batch_n").value, 10) || 1;
  if(mode === "del" && !confirm("批量删除 " + rows.length + " 行物品（数量设为 0）？")) return;
  var edits = rows.map(function(tr){
    var e = { section: tr.dataset.sec, slot: parseInt(tr.dataset.slot, 10) };
    var cur = parseInt(tr.dataset.cur, 10) || 0;
    var max = parseInt(tr.querySelector(".bag-num").max, 10);
    var v;
    if(mode === "add") v = Math.min(max, cur + n);
    else if(mode === "sub") v = Math.max(0, cur - n);
    else v = 0;
    if(tr.dataset.field === "amount") e.amount = v; else e.durability = v;
    return e;
  });
  stateEditPost("/api/state/bag", {
    account: state.account, character: state.character.id, edits: edits,
    reason: "GM 工具背包批量操作"
  }, "bag_msg", function(){
    toast("批量操作完成：" + edits.length + " 行", "ok");
    selectCharacter(state.character.id);
  });
}

function stateEditPost(path, body, msgEl, done){
  var msg = el(msgEl);
  if(msg) msg.textContent = "提交中…";
  api(path, {method:"POST", body:body}).then(function(o){
    var receipt = o.receipt ? JSON.stringify(o.receipt) : "";
    if(msg){
      msg.innerHTML = "<span class=\"ok\">" + esc(o.message || "完成") + "</span> " + esc(o.note || "") +
        (o.backup ? "<br>备份：" + esc(o.backup) : "") +
        (receipt ? "<br><span class=\"tag\">回执 " + esc(receipt) + "</span>" : "");
    }
    toast(o.message || "已写入", "ok", receipt ? "回执：" + receipt.slice(0, 120) : "");
    if(done) done(o);
  }).catch(function(e){
    if(msg) msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>（没有写入，或已整笔回滚）";
    toast("操作失败：" + e.message, "err");
  });
}

function bindCharCards(){
  bindAttrToggle();
  Array.prototype.forEach.call(document.querySelectorAll(".eq-slot"), function(el2){
    el2.onclick = function(){
      var slot = parseInt(this.dataset.slot, 10);
      var item = (state.bag||[]).find(function(x){return x.section==="worn" && x.slot===slot;});
      var box = el("eq_detail");
      if(box && item){
        var sn = SLOT_NAMES[item.slot] || ("槽"+item.slot);
      box.innerHTML = "<b style=\"color:#1f2430\">" + esc(item.name||"") + "</b><br>"
          + "部位：" + esc(sn) + "（槽位 " + item.slot + "）<br>"
          + "物品ID：" + item.template + "<br>"
          + "类别：" + esc((item.category&&item.category.group)||"") + " / " + esc((item.category&&item.category.sub)||"") + "<br>"
          + "耐久：" + (item.durability||0) + "　数量：" + (item.count||1);
      }
    };
  });
  var lim = state.limits || {};
  if(!lim.enabled || !state.detail) return;
  if(el("lv_do")) el("lv_do").onclick = function(){
    var v = parseInt(el("lv_target").value, 10);
    if(isNaN(v) || v < 1){ el("lv_msg").innerHTML = "<span class=\"err\">等级要填 1 以上的整数。</span>"; return; }
    var cap = lim.server_level_cap || 0;
    if(cap && v > cap){ el("lv_msg").innerHTML = "<span class=\"err\">服务端上限是 " + cap + " 级。</span>"; return; }
    var note = v > (lim.client_level_cap || 115)
      ? "\n\n注意：目标等级 " + v + " 超过客户端上限 " + (lim.client_level_cap||115) + "。\n公开资料记录过超过上限会导致服务端崩溃/假死、物品全红、拿不到 SP。\n确定要改吗？"
      : "";
    if(note && !confirm("把 " + state.character.name + " 从 Lv." + state.character.level + " 改成 Lv." + v + "？" + note)) return;
    stateEditPost("/api/state/level", {
      account: state.account, character: state.character.id,
      level: v, recalc_skill_points: el("lv_recalc").checked,
      reason: "GM 工具改等级 -> " + v
    }, "lv_msg", refreshCharacter);
  };
  function skillsBody(recalc){
    var b = { account: state.account, character: state.character.id,
      reason: recalc ? "GM 工具按等级重算 SP" : "GM 工具改技能点" };
    if(recalc){
      b.recalc_skill_points = true;
    } else {
      b.skill_points = [parseInt(el("sk_sp0").value,10)||0, parseInt(el("sk_sp1").value,10)||0];
      b.technique_points = [parseInt(el("sk_tp0").value,10)||0, parseInt(el("sk_tp1").value,10)||0];
    }
    return b;
  }
  if(el("sk_do")) el("sk_do").onclick = function(){
    stateEditPost("/api/state/skills", skillsBody(false), "sk_msg", refreshCharacter);
  };
  if(el("sk_recalc")) el("sk_recalc").onclick = function(){
    stateEditPost("/api/state/skills", skillsBody(true), "sk_msg", refreshCharacter);
  };
  if(el("bag_do")) el("bag_do").onclick = function(){
    var edits = [], bad = "";
    Array.prototype.forEach.call(document.querySelectorAll("input.bagedit"), function(inp){
      var raw = inp.value.trim();
      if(raw === ""){ bad = bad || "有空的数量/耐久没填。"; return; }
      var v = parseInt(raw, 10);
      if(isNaN(v) || v < 0){ bad = bad || "数量/耐久要是 0 以上的整数。"; return; }
      if(v > parseInt(inp.max, 10)){ bad = bad || ("超过上限 " + inp.max + "。"); return; }
      if(String(v) === inp.dataset.orig) return;
      var e = { section: inp.dataset.section, slot: parseInt(inp.dataset.slot, 10) };
      e[inp.dataset.field] = v;
      if(inp.dataset.field === "amount") e.amount = v; else e.durability = v;
      edits.push(e);
    });
    if(bad){ el("bag_msg").innerHTML = "<span class=\"err\">" + esc(bad) + "</span>"; return; }
    if(!edits.length){ el("bag_msg").innerHTML = "<span class=\"err\">没有改动。</span>"; return; }
    var zero = edits.filter(function(e){ return e.amount === 0; }).length;
    if(zero && !confirm("有 " + zero + " 行数量填了 0，这些行会被删除。确定要保存吗？")) return;
    stateEditPost("/api/state/bag", {
      account: state.account, character: state.character.id, edits: edits,
      reason: "GM 工具改背包数量/耐久"
    }, "bag_msg", refreshCharacter);
  };
  if(el("q_do")) el("q_do").onclick = function(){
    if(!el("q_confirm").checked){
      el("q_msg").innerHTML = "<span class=\"err\">先勾选上面的二次确认。</span>";
      return;
    }
    var q = state.quests || {};
    if(!q.accepted){
      el("q_msg").innerHTML = "<span class=\"err\">这个角色现在没有已接取的任务。</span>";
      return;
    }
    if(!confirm("把 " + state.character.name + " 的 " + q.accepted + " 条已接取任务改成已完成？\n只改状态，不插入新任务。\n请先确认角色已经切换到别的角色（或退回选人界面）。")) return;
    stateEditPost("/api/state/quests", {
      account: state.account, character: state.character.id,
      confirm: true, expect_accepted: q.accepted,
      reason: "GM 工具一键完成已接取任务"
    }, "q_msg", refreshCharacter);
  };
  if(el("q_list_refresh")) el("q_list_refresh").onclick = loadQuestList;
  if(el("q_list_filter")) el("q_list_filter").onchange = renderQuestList;
  if(el("q_list_all")) el("q_list_all").onchange = function(){
    var checked = this.checked;
    document.querySelectorAll(".qchk").forEach(function(cb){ cb.checked = checked; });
  };
  if(el("q_ready_do")) el("q_ready_do").onclick = function(){
    var ids = [];
    document.querySelectorAll(".qchk:checked").forEach(function(cb){
      ids.push(parseInt(cb.value,10));
    });
    if(!ids.length){
      el("q_ready_msg").innerHTML = "<span class=\"err\">请先勾选任务。</span>";
      return;
    }
    var grant = el("q_ready_grant").checked;
    if(!confirm("把角色 " + state.character.name + " 的 " + ids.length + " 条任务设为可提交？" +
      (grant ? "\n同时补发任务所需物品到背包。" : "") +
      "\n请先把角色切换到别的角色或退回选人界面。")) return;
    stateEditPost("/api/quest/ready", {
      account: state.account, character: state.character.id,
      quest_ids: ids, grant_items: grant
    }, "q_ready_msg", function(){ loadQuestList(); });
  };
  setTimeout(loadQuestList, 100);
  if(el("q_search_btn")) el("q_search_btn").onclick = searchItems;
  if(el("q_search_input")) el("q_search_input").onkeydown = function(e){ if(e.key==="Enter") searchItems(); };
}

function searchItems(){

      '<td style="padding:4px">' + (it.grantable!==false ? '<button class="btn sm" style="background:#2f6fed;color:#fff" onclick="sendToMail(' + it.id + ')">→ 发到邮件</button>' : '<span style="color:#ccc">-</span>') + '</td>' +

    });

var questListData = [];

function loadQuestList(){
  if(!state.character) return;
  api("/api/quest/list?character_id=" + state.character.id, {method:"GET"}).then(function(o){
    questListData = o.quests || [];
    renderQuestList();
  }).catch(function(e){
    var body = el("q_list_body");
    if(body) body.innerHTML = "<div style=\"padding:10px;color:#c00\">加载失败：" + esc(e.message) + "</div>";
  });
}

function renderQuestList(){
  var body = el("q_list_body");
  if(!body) return;
  var filter = el("q_list_filter") ? el("q_list_filter").value : "all";
  var rows = questListData.filter(function(q){
    if(filter === "all") return true;
    if(filter === "accepted") return q.status === "accepted" && q.progress > 0;
    if(filter === "ready") return q.status === "accepted" && q.progress === 0;
    if(filter === "completed") return q.status === "completed";
    return true;
  });
  if(!rows.length){
    body.innerHTML = "<div style=\"padding:10px;color:#888\">无任务记录</div>";
    return;
  }
  var html = "<table style=\"width:100%;font-size:12px;border-collapse:collapse\">" +
    "<tr style=\"background:#f4f6fa;text-align:left\"><th></th><th>ID</th><th>类型</th><th>等级</th><th>状态</th><th>所需物品</th></tr>";
  rows.forEach(function(q){
    var itemsStr = q.need_items && q.need_items.length
      ? q.need_items.map(function(it){ return it.template + (it.name ? " (" + it.name + ")" : "") + "x" + it.amount; }).join(", ")
      : "-";
    var statusColor = q.state_label === "已完成" ? "#888" : (q.state_label === "可提交" ? "#0a0" : "#3a4250");
    var disabled = q.status === "completed" ? " disabled" : "";
    html += "<tr style=\"border-bottom:1px solid #eef\">" +
      "<td><input type=\"checkbox\" class=\"qchk\" value=\"" + q.quest_id + "\"" + disabled + " style=\"width:auto\"></td>" +
      "<td>" + q.quest_id + "</td>" +
      "<td>" + esc(q.kind || "-") + "</td>" +
      "<td>" + (q.level || "-") + "</td>" +
      "<td style=\"color:" + statusColor + "\">" + esc(q.state_label) + "</td>" +
      "<td style=\"color:#555\">" + esc(itemsStr) + "</td>" +
    "</tr>";
  });
  html += "</table>";
  body.innerHTML = html;
}

    var fn = el("fnote");
    if(fn) fn.innerHTML = "品级中文名来源：" + esc(f.rarity_source) +
      " · 装备 " + f.equipment + " 件：已归类 " + f.slot_covered + " 件，其余 " + f.slot_unknown + " 件；有等级 " + f.level_known + " 件，无等级 " + f.level_unknown + " 件";
    var g = el("gnote");
    if(g){
      var notes = (f.grant_notes||[]).map(function(n){ return esc(n.label) + " —— " + n.count + " 件"; }).join("<br>");
      g.innerHTML = "可发放 <b>" + f.grantable + "</b> 件 / 不可发放 <b>" + f.not_grantable + "</b> 件（装扮类无容器被挡 " + (f.avatar_blocked||0) + " 件）。" +
        "<br>判定来源：" + esc(f.grant_source) + (notes ? "<br>不可发放原因：<br>" + notes : "");
    }
  }).catch(function(e){ var fn = el("fnote"); if(fn) fn.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}
function renderSlots(){
  var box = el("slots"); if(!box || !state.filters) return;
  var html = kw("slot", "", "全部", state.filters.equipment, state.slot, null);
  state.filters.slots.forEach(function(s){ html += kw("slot", s.key, s.label, s.count, state.slot, null); });
  box.innerHTML = html;
  bindKws(box, "slot", function(v){ state.slot = v; renderSlots(); doSearch(); });
}
function renderLevels(){
  var box = el("levels"); if(!box || !state.filters) return;
  var activeKey = (state.levelMin||state.levelMax) ? (state.levelMin + "-" + state.levelMax) : "";
  var html = kw("lv", "", "全部", state.filters.level_known, activeKey, null);
  state.filters.levels.forEach(function(l){
    html += kw("lv", l.min + "-" + l.max, l.label, l.count, activeKey, null, false, l.min, l.max);
  });
  box.innerHTML = html;
  bindKws(box, "lv", function(v, n){
    if(!v){ state.levelMin = 0; state.levelMax = 0; }
    else { state.levelMin = parseInt(n.dataset.min,10)||0; state.levelMax = parseInt(n.dataset.max,10)||0; }
    renderLevels(); doSearch();
  });
}
function renderRarities(){
  var box = el("rarities"); if(!box || !state.filters) return;
  var total = 0;
  state.filters.rarities.forEach(function(r){ total += r.count; });
  var html = kw("rarity", "", "全部", total, state.rarity, null);
  state.filters.rarities.forEach(function(r){
    html += kw("rarity", r.key, r.label, r.count, state.rarity, RARITY_COLORS[parseInt(r.key,10)]);
  });
  box.innerHTML = html;
  bindKws(box, "rarity", function(v){ state.rarity = v; renderRarities(); doSearch(); });
}
function isOutfitKeep(label){
  // 时装穿戴部位（帽子/头发/脸/胸/上衣/下装/鞋/腰）去掉，保留 皮肤/光环/武器装扮
  if(label && label.indexOf("时装·") === 0){
    if(label === "时装·皮肤" || label === "时装·武器装扮" || label === "时装·光环") return true;
    return false;
  }
  return true;
}
function kw(attr, key, label, count, activeVal, color, sub, min, max){
  var on = String(activeVal||"") === String(key);
  var attrs = " data-" + attr + "=\"" + esc(key) + "\"";
  if(min !== undefined){ attrs += " data-min=\"" + min + "\""; }
  if(max !== undefined){ attrs += " data-max=\"" + max + "\""; }
  var dot = color ? "<span class=\"dot\" style=\"background:" + color + "\"></span>" : "";
  var n = "";
  var cls = "kw" + (on ? " active" : "") + (sub ? " sub" : "") + (count === 0 ? " zero" : "");
  return "<span class=\"" + cls + "\"" + attrs + ">" + dot + esc(label) + n + "</span>";
}
function bindKws(box, attr, onPick){
  Array.prototype.forEach.call(box.querySelectorAll(".kw"), function(n){
    n.onclick = function(){ onPick(n.dataset[attr] || "", n); };
  });
}
function slotTag(it){ return it.slot || it.type_label || (it.kind==="equipment" ? "装备" : "普通"); }

function doSearch(){
  var q = el("q"); if(!q) return;
  var url = "/api/items?q=" + encodeURIComponent(q.value) +
    "&type=" + encodeURIComponent(state.itemType) +
    "&slot=" + encodeURIComponent(state.slot) +
    "&level_min=" + (state.levelMin||"") +
    "&level_max=" + (state.levelMax||"") +
    "&rarity=" + encodeURIComponent(state.rarity) +
    (state.grantableOnly ? "&grantable=1" : "") +
    "&limit=60";
  api(url).then(function(o){
    var blocked = 0;
    o.items.forEach(function(it){ if(!it.grantable) blocked++; });
    var rc = el("rescount");
    if(rc) rc.innerHTML = "命中 " + (o.count||0) + " 条" +
      (blocked ? "（其中 <span class=\"warn\">不可发放 " + blocked + " 条</span>）" : "") +
      ((o.count||0) >= 60 ? "（只显示前 60 条）" : "");
    var res = el("res");
    if(!res) return;
    res.innerHTML = o.items.map(function(it){
      var zh = it.name || it.name_en || "(未命名)";
      var color = RARITY_COLORS[it.rarity] || "#1f2430";
      var en = (it.name_en && it.name_en !== it.name) ? "<span class=\"tag\">" + esc(it.name_en) + "</span>" : "";
      var parts = ["ID " + it.id];
      if(it.level) parts.push("Lv" + it.level);
      if(it.rarity_label) parts.push(it.rarity_label);
      if(it.grade) parts.push("品级值 " + it.grade);
      var av = it.avatar ? " <span class=\"pill no\">装扮</span>" : "";
      var no = it.grantable ? "" : " <span class=\"pill no\" title=\"" + esc(it.grant_note||"") + "\">不可发放</span>";
      return "<div class=\"row2" + (it.grantable ? "" : " blocked") + "\" data-id=\"" + it.id +
        "\" data-name=\"" + esc(zh) + "\" data-grantable=\"" + (it.grantable ? "1" : "0") +
        "\" data-note=\"" + esc(it.grant_note||"") + "\">" +
        "<span><span class=\"nm\" style=\"color:" + color + "\">" + esc(zh) + "</span> " + en + av + no +
        "<div class=\"tag\">" + esc(parts.join(" · ")) + "</div>" +
        (it.grantable ? "" : "<div class=\"tag warn\">" + esc(it.grant_note||"") + "</div>") +
        "</span><span class=\"tag\"><span class=\"pill\">" + esc(slotTag(it)) + "</span></span></div>";
    }).join("") || "<div class=\"row2\">没有匹配的物品</div>";
    Array.prototype.forEach.call(res.querySelectorAll(".row2"), function(n){
      if(!n.dataset.id) return;
      n.onclick = function(){
        if(n.dataset.grantable === "0"){
          var m = el("msg");
          if(m) m.innerHTML = "<span class=\"err\">「" + esc(n.dataset.name) + "」发不了：" + esc(n.dataset.note || "服务端发放路径不接受这件物品") + "</span>";
          toast("「" + n.dataset.name + "」不可发放", "warn", n.dataset.note || "");
          return;
        }
        addChosen(parseInt(n.dataset.id,10), n.dataset.name);
      };
    });
  }).catch(function(e){ var rc = el("rescount"); if(rc) rc.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}
function addChosen(id, name){
  for(var i=0;i<chosen.length;i++) if(chosen[i].id===id) { chosen[i].amount++; renderChosen(); return; }
  chosen.push({id:id, name:name, amount:1}); renderChosen();
}
function renderChosen(){
  var box = el("chosen"); if(!box) return;
  box.innerHTML = chosen.map(function(c2,i){
    return "<div class=\"chosen\"><span style=\"flex:1\">" + esc(c2.name) + " <span class=\"tag\">ID " + c2.id + "</span></span>" +
      "<input type=\"number\" min=\"1\" value=\"" + c2.amount + "\" data-i=\"" + i + "\">" +
      "<button class=\"btn ghost sm\" data-del=\"" + i + "\">移除</button></div>";
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("input"), function(inp){
    inp.onchange = function(){ chosen[parseInt(inp.dataset.i,10)].amount = Math.max(1, parseInt(inp.value,10)||1); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
    b.onclick = function(){ chosen.splice(parseInt(b.dataset.del,10),1); renderChosen(); };
  });
}
function doGrant(){
  var g = el("g_char"), gold = el("g_gold"), cera = el("g_cera"), reason = el("g_reason"), msg = el("msg");
  var body = {
    account: state.account,
    character: parseInt(g.value,10) || 0,
    gold: parseInt(gold.value,10) || 0,
    cera: parseInt(cera.value,10) || 0,
    reason: reason.value || "GM 工具发放",
    items: []
  };
  if(!body.character && body.gold){ msg.innerHTML = "<span class=\"err\">金币必须指定角色。</span>"; return; }
  if(!body.gold && !body.cera){ msg.innerHTML = "<span class=\"err\">没有可发放的内容。</span>"; return; }
  el("do").disabled = true; msg.textContent = "提交中…";
  api("/api/grant", {method:"POST", body:body}).then(function(o){
    msg.innerHTML = "<span class=\"ok\">" + esc(o.message) + "</span> " + esc(o.note||"");
    toast(o.message, "ok", "发放ID " + o.grant_id);
    if(state.character) selectCharacter(state.character.id);
    else { loadHistory(); }
    loadAccounts();
  }).catch(function(e){ msg.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; toast("发放失败：" + e.message, "err"); })
    .then(function(){ el("do").disabled = false; });
}
function loadHistory(){
  if(!state.account) return;
  api("/api/history?account=" + state.account).then(function(o){
    var h = el("hist"); if(!h) return;
    h.innerHTML = (o.history||[]).map(function(r){
      return "<div style=\"padding:4px 0;border-bottom:1px solid #f0f2f7\">" + esc(r.at) + " · <b>" + esc(r.grant_id) + "</b> · " + esc(r.operator) + " · " + esc(r.reason) + "</div>";
    }).join("") || "还没有发放记录。";
  }).catch(function(e){ var h = el("hist"); if(h) h.innerHTML = "<span class=\"err\">" + esc(e.message) + "</span>"; });
}

// ================= 服务器控制 =================
function renderServerView(){
  renderTabs([]);
  var o = state.overview;
  var c = el("content");
  var healthTxt = state.health === "ok" ? "<span class=\"ok\">● 正常</span>" : (state.health === "bad" ? "<span class=\"err\">● 连接失败</span>" : "检测中…");
  c.innerHTML =
  "<div class=\"card\"><h3>服务端连接状态</h3>" +
    "<div class=\"kv\">" +
      "<div>GM 后端 (gmweb)</div><div>" + healthTxt + " · 127.0.0.1:28080</div>" +
      "<div>管理台入口</div><div>http://127.0.0.1:28081/</div>" +
      "<div>最近探测</div><div>" + (state.healthAt || "—") + "</div>" +
    "</div>" +
    "<div class=\"actions\" style=\"margin-top:14px\"><button class=\"btn\" id=\"sv_refresh\">立即探测 / 刷新</button></div>" +
    "<div class=\"hint\">绿灯 = gmweb 与数据库正常；红灯 = 连接失败（请确认 GM 工具已启动、数据库在运行）。</div>" +
  "</div>" +
  "<div class=\"card\"><h3>环境信息</h3>" +
    "<div class=\"kv\">" +
      "<div>环境根目录</div><div>" + esc(o ? (o.root||"—") : "—") + "</div>" +
      "<div>物品索引</div><div>" + (o ? o.items : "—") + " 件</div>" +
      "<div>索引来源</div><div>" + esc(o ? (o.index_source||"—") : "—") + "</div>" +
      "<div>目录等级上限</div><div>" + (o ? o.grade_cap : "—") + "</div>" +
      "<div>操作用户</div><div>" + esc(o ? (o.operator||"—") : "—") + "</div>" +
      "<div>GM 工具启动时间</div><div>" + esc(o ? (o.started||"—") : "—") + "</div>" +
    "</div></div>" +
  "<div class=\"card\"><h3>说明</h3>" +
    "<div class=\"hint\">游戏服务端（7001 端口）由 <b>DFO账号启动器.cmd</b> 启动/停止；本管理台只读地探测 gmweb 后端状态，不直接操作游戏进程。</div>" +
    "<div class=\"hint\">如需重启游戏服务端：请使用桌面上的「DFO账号启动器」→「停止环境」→ 重新选择账号启动。</div>" +
  "</div>";
  el("sv_refresh").onclick = function(){ refreshAll(); };
}

// ================= 系统设置 =================
function renderSettingsView(){
  renderTabs([]);
  var o = state.overview;
  var lim = state.limits || {};
  var c = el("content");
  c.innerHTML =
  "<div class=\"card\"><h3>访问令牌（Token）</h3>" +
    "<div class=\"row\"><div style=\"flex:3\"><input id=\"set_token\" readonly value=\"" + esc(TOKEN) + "\"></div>" +
    "<div style=\"flex:0\"><button class=\"btn ghost\" id=\"copy_token\">复制</button></div></div>" +
    "<div class=\"hint\">管理台经由本地代理访问 gmweb，token 由代理自动注入；此令牌即 gmweb 的访问令牌，请勿泄露。</div></div>" +
  "<div class=\"card\"><h3>数据源</h3>" +
    "<div class=\"kv\">" +
      "<div>物品索引来源</div><div>" + esc(o ? (o.index_source||"—") : "—") + "</div>" +
      "<div>物品索引数</div><div>" + (o ? o.items : "—") + " 件</div>" +
      "<div>账号数</div><div>" + state.accounts.length + "</div>" +
      "<div>操作者</div><div>" + esc(o ? (o.operator||"—") : "—") + "</div>" +
      "<div>备份目录</div><div>" + esc(lim.backup_dir || "—（选中角色后显示）") + "</div>" +
    "</div></div>" +
  "<div class=\"card\"><h3>功能约束</h3>" +
    "<div class=\"hint\">· 改等级：服务端硬上限 " + (lim.server_level_cap || 115) + " 级，客户端上限 " + (lim.client_level_cap || 115) + " 级，等级与经验成对写入。</div>" +
    "<div class=\"hint\">· 改技能点：SP/TP 两条账本，重算 SP 按当前等级补满。</div>" +
    "<div class=\"hint\">· 背包：只改已有行（物品行填 0 删除；装备行只改耐久）。</div>" +
    "<div class=\"hint\">· 任务：只改已接取任务状态，不插入新任务。</div>" +
    "<div class=\"hint\">· 转职/觉醒：出于存档一致性考虑禁用。</div>" +
  "</div>";
  el("copy_token").onclick = function(){
    el("set_token").select();
    document.execCommand("copy");
    toast("Token 已复制", "ok");
  };
}

// ================= 一键刷新 =================
function refreshAll(){
  toast("正在刷新数据…", "info");
  state.accounts = [];
  pingServer();
  loadAccounts();
  if(state.account){
    api("/api/characters?account=" + state.account).then(function(o){
      state.cera = o.cera; state.chars = o.characters || [];
      updateGmInfo();
      if(state.character){
        api("/api/character?id=" + state.character.id).then(function(d){
          state.character = d.character; state.detail = d; state.bag = d.bag||[];
          state.quests = d.quests||{}; state.limits = d.limits||{};
          if(state.view === "characters" || state.view === "quests") renderView();
          toast("数据已刷新", "ok");
        }).catch(function(){});
      } else {
        if(state.view === "characters") renderView();
        toast("数据已刷新", "ok");
      }
    });
  } else {
    if(state.view === "accounts") renderView();
  }
}

// ================= 初始化 =================
function init(){
  Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function(n){
    n.onclick = function(){ switchView(n.dataset.view); };
  });
  el("refreshBtn").onclick = refreshAll;
  el("searchBtn").onclick = doGlobalSearch;
  el("globalSearch").addEventListener("keydown", function(e){
    if(e.key === "Enter") doGlobalSearch();
  });
  document.addEventListener("click", function(e){
    var box = el("searchResults");
    if(box && !e.target.closest(".searchbar")) box.style.display = "none";
  });
  var h = (location.hash||"").replace("#","");
  if(VIEW_TITLES[h]) switchView(h); else switchView("accounts");
  pingServer();
  setInterval(pingServer, 15000);
}
init();
</script>
