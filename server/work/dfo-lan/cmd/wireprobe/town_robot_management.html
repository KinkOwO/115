<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>115US 假人管理</title>
<style>body{font:16px system-ui;background:#101726;color:#e8edf8;margin:0;padding:28px;max-width:1250px}h1{margin-top:0}small,p{color:#aebbd2}button,input,select{font:inherit;padding:9px;border-radius:6px;border:1px solid #485571;background:#202c41;color:inherit;margin:4px}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}section{padding:18px;background:#192338;border-radius:12px;margin:16px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #35415a}#status{white-space:pre-wrap;color:#ffce82}pre{white-space:pre-wrap;max-height:300px;overflow:auto}.bar{display:flex;flex-wrap:wrap;align-items:center}details{font-size:13px}#results{max-height:240px;overflow:auto}.item{display:block;width:95%;text-align:left}</style>
<h1>115US 假人管理</h1><p>这里查看假人的真实穿戴和背包，发放装备、时装、宠物及材料。发放到假人独立背包，不扣玩家物品；发放后需穿戴才会改变外观。</p><p>游戏内可通过假人交互栏查看角色信息和邀请组队。职业、觉醒和技能须在假人离队后调整，重新邀请后生效。</p>
<div class="bar"><label>假人 <select id="robot"></select></label><button id="refresh">刷新</button><span id="summary"></span></div><p id="status" role="status"></p>
<section><h2>发放物品</h2><div class="bar"><input id="query" placeholder="物品名称、脚本路径或编号"><button id="search">搜索</button></div><div id="results"></div><div class="bar"><input id="template" type="number" min="1" placeholder="物品编号"><input id="amount" type="number" min="1" max="50" value="1" aria-label="数量"><button id="grant">发放至背包</button></div><small>物品有效性、容量和装备职业限制由原有服务校验；不自动发放全套或覆盖旧装备。</small></section>
<section><h2>等级</h2><div class="bar"><input id="level" type="number" min="1" placeholder="目标等级"><button id="setlevel">按PVF调整等级</button></div><small>等级成长沿用当前PVF。此操作不自动完成觉醒、任务或技能学习。</small></section>
<section><h2>职业与技能</h2><div class="bar"><select id="advancement" aria-label="转职分支"></select><button id="advance">转职</button><button id="awaken">完成下一阶段觉醒</button><button id="skills">查看可学技能</button><span id="progression"></span></div><div id="skillrows"></div></section>
<section><h2>穿戴与背包</h2><div id="inventory"></div></section><section><h2>基础属性</h2><pre id="attributes"></pre><small>这是PVF成长基础属性，不是副本内最终攻击力或包含装备效果的完整战力。</small></section>
<script>
const key=location.hash.slice(1)||sessionStorage.getItem('robot-key')||'';if(key)sessionStorage.setItem('robot-key',key);history.replaceState(null,'',location.pathname);let data={robots:[]},busy=false;
const $=id=>document.getElementById(id);const selected=()=>data.robots.find(r=>r.id===Number($('robot').value));
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Robot-Key':key,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(await r.text());return r.json()}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('status').textContent='处理中…';try{await fn();$('status').textContent='已完成。'}catch(e){$('status').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function render(){const prev=$('robot').value;$('robot').replaceChildren();for(const r of data.robots){const o=node('option',r.name+' · '+r.level+'级');o.value=r.id;$('robot').append(o)}if(data.robots.some(r=>String(r.id)===prev))$('robot').value=prev;renderSelected()}
function renderSelected(){const r=selected();$('inventory').replaceChildren();if(!r){$('summary').textContent='请先在游戏进入公共城镇，生成假人后刷新。';return}$('summary').textContent=(data.item_names_ready?'物品名称已就绪 · ':'物品名称索引加载中，可按编号搜索 · ')+'职业 '+r.profession+' · 当前场景 '+(r.actors.length?'可见':'未生成')+' · 保存版本 '+r.revision;$('level').value=r.level;$('skillrows').replaceChildren();$('advancement').replaceChildren();for(const branch of r.advancements||[]){const o=node('option','转职分支 '+branch);o.value=branch;$('advancement').append(o)}$('progression').textContent='转职 '+r.advancement+' · 觉醒 '+r.awakening+' · 剩余 SP '+r.skill_points;$('attributes').textContent=JSON.stringify(r.attributes,null,2);
const table=node('table');const head=node('tr');for(const x of ['位置','物品','类型','操作','实例详情'])head.append(node('th',x));table.append(head);
for(const e of r.items){const tr=node('tr');tr.append(node('td',(e.list===3?'穿戴':e.list===1?'时装背包':e.list===7?'宠物背包':'装备背包')+' / '+e.slot),node('td',e.name+' ('+e.template+')'),node('td',e.kind));const action=node('td');
if(e.list!==3&&e.wear_slot!==undefined){const b=node('button','穿戴');b.onclick=()=>run(()=>move(e,3,e.wear_slot));action.append(b)}
if(e.list===3){const b=node('button','卸下');b.onclick=()=>run(async()=>{const list=e.kind==='[creature]'?7:e.slot<=11?1:0;const entered=prompt('卸下到背包槽位（占用槽会按原有规则交换）');if(entered===null)return;const slot=Number(entered);if(!Number.isInteger(slot)||slot<0||slot>65535)throw Error('槽位无效');await move(e,list,slot)});action.append(b)}
tr.append(action);const td=node('td'),detail=node('details');detail.append(node('summary','查看'),node('pre',JSON.stringify(e.details,null,2)));td.append(detail);tr.append(td);table.append(tr)}$('inventory').append(table);if(r.stackables?.length){$('inventory').append(node('h3','材料与消耗品'),node('pre',JSON.stringify(r.stackables,null,2)))}}
async function change(body){const r=selected();if(!r)throw Error('请先选择假人');data=await api('/api/change',{id:r.id,revision:r.revision,...body});render()}
async function move(e,list,slot){const r=selected(),target=r.items.find(x=>x.list===list&&x.slot===slot);await change({action:'move',move:{SourceList:e.list,SourceSlot:e.slot,SourceItem:e.template,DestinationList:list,DestinationSlot:slot,DestinationItem:target?.template||0,Count:1,Selection:4294967295,Flags:[0,0,0]}})}
$('refresh').onclick=()=>run(async()=>{data=await api('/api/robots');render()});$('robot').onchange=renderSelected;
$('search').onclick=()=>run(async()=>{const rows=await api('/api/items?q='+encodeURIComponent($('query').value));$('results').replaceChildren();for(const r of rows){const b=node('button',r.name+' · '+r.id+' · '+r.kind);b.className='item';b.onclick=()=>{$('template').value=r.id};$('results').append(b)}if(!rows.length)$('results').append(node('p','未找到匹配物品。'))});
$('grant').onclick=()=>run(()=>change({action:'grant',template:Number($('template').value),amount:Number($('amount').value)}));$('setlevel').onclick=()=>run(()=>change({action:'level',level:Number($('level').value)}));

$('advance').onclick=()=>run(()=>change({action:'advancement',advancement:Number($('advancement').value)}));
$('awaken').onclick=()=>run(async()=>{const r=selected();if(!r)throw Error('请先选择假人');if(r.awakening>=3)throw Error('已完成三觉');await change({action:'awakening',awakening:r.awakening+1})});
async function showSkills(){const r=selected();if(!r)throw Error('请先选择假人');const rows=await api('/api/skills',{id:r.id});$('skillrows').replaceChildren();for(const row of rows){const line=node('div',row.name+' · '+row.rank+'级 ');if(row.next_cost!==undefined){const b=node('button','学习一级（'+row.next_cost+' SP）');b.onclick=()=>run(async()=>{await change({action:'skills',skills:{Tree:0,Entries:[{ID:row.id,Delta:1}]}});await showSkills()});line.append(b)}$('skillrows').append(line)}}
$('skills').onclick=()=>run(showSkills);
run(async()=>{if(!key)throw Error('请通过假人管理入口打开此页面。');data=await api('/api/robots');render()});
</script></html>
