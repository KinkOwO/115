# chinese-input.ini —— 中文输入插件开关
#
# 【背景】静态取证（analysis/tasks/chinese-input-probe-20261006.md）：
# 客户端只在满足两个条件时才启用它的 IME 通路——
#   1) IME 管理器里的键盘布局 ∈ { E0080404, E0090404, E00E0804 }（XP 时代的传统 IME HKL）
#   2) ImmGetIMEFileNameW 返回的文件名 ∈ { TINTLGNT.IME, CINTLGNT.IME,
#      MSTCIPHA.IME, PINTLGNT.IME, MSSCIPYA.IME }
# 本机布局是 0x08040804、ImmGetIMEFileNameW 直接返回 0（TSF 输入法没有传统 IME 文件），
# 两个门禁都过不去 ⇒ 中文输入整条链路不会被启用。
#
# 【本文件】把这两个门禁"喂"过去。只对**游戏主模块**生效（MSCTF 等系统模块照实回答，
# 否则会把输入法框架本身搞坏）。全 0 = 退回纯观察模式。
#
# 改完重启游戏即可生效（不需要重编译 DLL）。

# 把中文布局改报成传统 IME HKL（0x0804→E00E0804、0x0404→E0080404）
fix_layout=1

# ImmGetIMEFileNameW 返回白名单里的名字（仅当客户端拿到的名字不在白名单时）
fix_ime_name=1

# 给每个新建的顶层窗口补一条 WM_INPUTLANGCHANGE（覆盖「从消息取 HKL」那条路径）
post_layout=1

# 修正 Themida 导入槽：客户端是加壳的，它调 user32/imm32 走自己的导入桩
# （FF 25 → 槽里存着提前解析好的真实地址），改导出表对它无效。
fix_slots=1

# 钩住客户端门禁本体（RVA 0x6F22400），入口直接把 mgr+0x68 改成传统 IME 的 HKL。
fix_gate=1

# 吞掉客户端主动取消组字（ImmNotifyIME：NI_COMPOSITIONSTR + CPS_CANCEL）。
# 2026-10-06 实机：不打开它，客户端每打一个字就取消组字，拼音永远只有单个字母、候选窗用不了。
# ImmIsIME 对「传统布局」改报「是输入法」（实机 16:32：客户端问 ImmIsIME(0xE00E0804) 得到 0，
# 于是把拼音当普通字母上屏）
fix_isime=1

fix_cancel=1

# 兜底：万一客户端自己不接收上屏文字，由我们逐字投 WM_CHAR
#（先看客户端有没有自己读 GCS_RESULTSTR，读了就不插手，所以不会重复插入）。
# 实机验证时它一次都没触发 —— 上屏的中文是客户端自己读走并插入的。
ime_bridge=1

# 客户端 C2S 发包追踪（只观察客户端的发包链，不改内容）：
#   0 = 关（默认。第一次实机只验证上面两个门禁修复）
#   1 = 只记 opcode
#   2 = 连 body 前 48 字节一起记（用来查"删角色"到底发了什么）
# 它用 5/6 字节 inline 跳转改**客户端代码**（装之前逐字节核对现场，
# 对不上就不装），比导出表钩子风险高，所以默认关。
trace_c2s=0

# 冒充哪个输入法文件名（必须是上面 5 个之一）
ime_name=CINTLGNT.IME

# 两个冒充用的 HKL
layout_zhcn=E00E0804
layout_zhtw=E0080404
